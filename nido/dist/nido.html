  <script>
/* ==========================================================================
   Nido · Gráficos SVG
   Gráficos pequeños y sin dependencias. Todo el texto usa tokens de tinta;
   las marcas llevan `data-tip` para el tooltip global.
   ========================================================================== */
(function (N) {
  'use strict';
  const { U } = N;
  const C = {};
  N.Charts = C;

  const r1 = (v) => Math.round(v * 10) / 10;
  const svg = (w, h, body, cls = '') => `<svg class="chart ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${body}</svg>`;
  /* Barra con extremo superior redondeado (4px) anclada a la base. */
  const bar = (x, y, w, h, rad = 4) => {
    if (h <= 0) return '';
    const r = Math.min(rad, w / 2, h);
    return `M${r1(x)},${r1(y + h)}V${r1(y + r)}Q${r1(x)},${r1(y)} ${r1(x + r)},${r1(y)}H${r1(x + w - r)}Q${r1(x + w)},${r1(y)} ${r1(x + w)},${r1(y + r)}V${r1(y + h)}Z`;
  };
  const niceMax = (v, step) => Math.max(step, Math.ceil(v / step) * step);

  /* ---------- Sueño diario: noche + siestas apiladas, con banda recomendada ---------- */
  C.sleepBars = (days, rec) => {
    const W = 640, H = 220, pl = 34, pr = 8, pt = 12, pb = 26;
    const max = niceMax(Math.max(rec[1], ...days.map((d) => (d.night + d.day) / 60)), 4);
    const y = (h) => pt + (H - pt - pb) * (1 - h / max);
    const bw = (W - pl - pr) / days.length;
    let g = '';
    for (let h = 0; h <= max; h += 4) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(h)}" y2="${y(h)}"/><text class="ax" x="${pl - 6}" y="${y(h) + 4}" text-anchor="end">${h}h</text>`;
    g += `<rect class="band" x="${pl}" width="${W - pl - pr}" y="${y(rec[1])}" height="${y(rec[0]) - y(rec[1])}"/>`;
    g += `<text class="ax band-label" x="${W - pr - 4}" y="${y(rec[1]) + 12}" text-anchor="end">recomendado ${rec[0]}–${rec[1]} h</text>`;
    days.forEach((d, i) => {
      const x = pl + i * bw + bw * 0.2, w = bw * 0.6;
      const nh = d.night / 60, dh = d.day / 60;
      const tip = `${U.dateLong(d.key)}|Noche ${U.dur(d.night)} · Siestas ${U.dur(d.day)} (${d.naps})|Total ${U.dur(d.night + d.day)}`;
      // Noche abajo; siestas encima con 2px de separación
      const y0 = y(0), y1 = y(nh), y2 = y(nh + dh);
      g += `<g class="hit" data-tip="${U.esc(tip)}"><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>`;
      if (nh > 0) g += `<path class="m-night" d="${bar(x, y1, w, y0 - y1, dh > 0 ? 0 : 4)}"/>`;
      if (dh > 0) g += `<path class="m-nap" d="${bar(x, y2, w, Math.max(0, y1 - y2 - 2))}"/>`;
      g += '</g>';
      if (days.length <= 14 || i % 2 === (days.length - 1) % 2) {
        const dt = new Date(U.parseDay(d.key));
        g += `<text class="ax ${d.key === U.today() ? 'ax-strong' : ''}" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${days.length <= 7 ? U.WEEKDAYS[dt.getDay()] : dt.getDate()}</text>`;
      }
    });
    return svg(W, H, g);
  };

  /* ---------- Patrón de 24 h: una fila por día, bloques de sueño y marcas de toma ---------- */
  C.pattern = (rows, opts = {}) => {
    const W = 640, rowH = 16, gap = 5, pl = 58, pr = 8, pt = 22;
    const H = pt + rows.length * (rowH + gap) + 4;
    const x = (hour) => pl + (W - pl - pr) * (hour / 24);
    let g = '';
    [0, 3, 6, 9, 12, 15, 18, 21, 24].forEach((h) => {
      g += `<line class="grid" x1="${x(h)}" x2="${x(h)}" y1="${pt - 4}" y2="${H}"/><text class="ax" x="${x(h)}" y="${pt - 9}" text-anchor="middle">${String(h % 24).padStart(2, '0')}</text>`;
    });
    rows.forEach((r, i) => {
      const y = pt + i * (rowH + gap);
      const day0 = U.parseDay(r.key);
      const dt = new Date(day0);
      g += `<text class="ax ${r.key === U.today() ? 'ax-strong' : ''}" x="${pl - 8}" y="${y + rowH - 4}" text-anchor="end">${U.WEEKDAYS[dt.getDay()]} ${dt.getDate()}</text>`;
      g += `<rect class="track" x="${pl}" y="${y}" width="${W - pl - pr}" height="${rowH}" rx="4"/>`;
      r.blocks.forEach((b) => {
        const a = (b.a - day0) / U.HOUR, e = (b.b - day0) / U.HOUR;
        const w = Math.max(1.5, x(e) - x(a) - 1);
        g += `<rect class="${b.type === 'nap' ? 'm-nap' : 'm-night'}" x="${r1(x(a))}" y="${y}" width="${r1(w)}" height="${rowH}" rx="3" data-tip="${U.esc(`${b.type === 'nap' ? 'Siesta' : 'Noche'}|${U.time(b.a)} – ${U.time(b.b)} · ${U.dur((b.b - b.a) / U.MIN)}`)}"/>`;
      });
      if (opts.feeds) (r.feeds || []).forEach((t) => {
        const h = (t - day0) / U.HOUR;
        g += `<circle class="m-feed" cx="${r1(x(h))}" cy="${y + rowH / 2}" r="3.2" data-tip="Toma|${U.time(t)}"/>`;
      });
    });
    return svg(W, H, g, 'pattern');
  };

  /* ---------- Curva de crecimiento OMS ---------- */
  C.growth = (metric, sex, points, opts = {}) => {
    const W = 640, H = 300, pl = 40, pr = 40, pt = 12, pb = 30;
    const maxAge = opts.maxAge || 12;
    const S = N.S;
    const zs = [-1.881, -1.036, 0, 1.036, 1.881]; // P3, P15, P50, P85, P97
    const vals = []; for (let m = 0; m <= maxAge; m += 0.25) vals.push(m);
    const curve = (z) => vals.map((m) => [m, S.valueAtZ(metric, sex, m, z)]);
    const curves = zs.map(curve);
    const lo = Math.min(...curves[0].map((p) => p[1]), ...points.map((p) => p.v));
    const hi = Math.max(...curves[4].map((p) => p[1]), ...points.map((p) => p.v));
    const step = metric === 'weight' ? 1 : 2;
    const yMin = Math.floor(lo / step) * step, yMax = Math.ceil(hi / step) * step;
    const X = (m) => pl + (W - pl - pr) * (m / maxAge);
    const Y = (v) => pt + (H - pt - pb) * (1 - (v - yMin) / (yMax - yMin));
    const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${r1(X(p[0]))},${r1(Y(p[1]))}`).join('');
    const area = (a, b) => path(a) + b.slice().reverse().map((p) => `L${r1(X(p[0]))},${r1(Y(p[1]))}`).join('') + 'Z';
    let g = '';
    const ystep = (yMax - yMin) / step > 10 ? step * 2 : step;
    for (let v = yMin; v <= yMax + 1e-9; v += ystep) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    const xstep = maxAge > 12 ? 3 : maxAge > 6 ? 2 : 1;
    for (let m = 0; m <= maxAge; m += xstep) g += `<text class="ax" x="${X(m)}" y="${H - 10}" text-anchor="middle">${m}m</text>`;
    g += `<path class="p-band-out" d="${area(curves[0], curves[4])}"/><path class="p-band-in" d="${area(curves[1], curves[3])}"/>`;
    ['P3', 'P15', 'P50', 'P85', 'P97'].forEach((lbl, i) => {
      g += `<path class="${i === 2 ? 'p-median' : 'p-line'}" d="${path(curves[i])}"/>`;
      const last = curves[i][curves[i].length - 1];
      g += `<text class="ax p-lbl" x="${W - pr + 4}" y="${Y(last[1]) + 4}">${lbl}</text>`;
    });
    if (points.length) {
      g += `<path class="m-line" d="${path(points.map((p) => [p.age, p.v]))}"/>`;
      points.forEach((p, i) => {
        const pc = S.percentile(metric, sex, p.age, p.v);
        const tip = `${U.date(p.date, true)} · ${U.ageShort(N.S.baby().birth, U.parseDay(p.date))}|${U.num(p.v, N.METRICS[metric].digits)} ${N.METRICS[metric].unit}|Percentil ${Math.round(pc)}`;
        g += `<circle class="m-dot ${i === points.length - 1 ? 'last' : ''}" cx="${r1(X(p.age))}" cy="${r1(Y(p.v))}" r="${i === points.length - 1 ? 6 : 4.5}" data-tip="${U.esc(tip)}"/>`;
      });
    }
    if (opts.now != null) g += `<line class="now-line" x1="${X(opts.now)}" x2="${X(opts.now)}" y1="${pt}" y2="${H - pb}"/>`;
    return svg(W, H, g, 'growth');
  };

  /* ---------- Anillo de progreso ---------- */
  C.ring = (value, max, size = 120, stroke = 12, cls = '') => {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = U.clamp(value / max, 0, 1);
    return `<svg class="ring ${cls}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
      <circle class="ring-track" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" fill="none"/>
      <circle class="ring-val" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" fill="none" stroke-linecap="round"
        stroke-dasharray="${r1(c * p)} ${r1(c)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
  };

  /* ---------- Barras simples (tomas/pañales por día) ---------- */
  C.miniBars = (items, cls = 'm-feed') => {
    const W = 320, H = 90, pb = 18, pt = 14;
    const max = Math.max(1, ...items.map((d) => d.v));
    const bw = W / items.length;
    let g = '';
    items.forEach((d, i) => {
      const h = (H - pb - pt) * (d.v / max);
      const x = i * bw + bw * 0.22, w = bw * 0.56;
      g += `<g data-tip="${U.esc(d.tip)}"><rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/><path class="${cls}" d="${bar(x, H - pb - h, w, h, 3)}"/></g>`;
      if (i === items.length - 1) g += `<text class="ax ax-strong" x="${x + w / 2}" y="${H - pb - h - 4}" text-anchor="middle">${d.v}</text>`;
      g += `<text class="ax" x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${d.label}</text>`;
    });
    return svg(W, H, g, 'mini');
  };

  /* ---------- Reloj de 24 h del día de hoy ---------- */
  C.dayClock = (blocks, feeds, now) => {
    const S = 220, c = S / 2, R = 92, w = 16;
    const day0 = U.dayStart(now);
    const ang = (t) => ((t - day0) / U.DAY) * Math.PI * 2 - Math.PI / 2;
    const arc = (a, b, r) => {
      const a0 = ang(a), a1 = ang(b), large = a1 - a0 > Math.PI ? 1 : 0;
      return `M${r1(c + r * Math.cos(a0))},${r1(c + r * Math.sin(a0))}A${r},${r} 0 ${large} 1 ${r1(c + r * Math.cos(a1))},${r1(c + r * Math.sin(a1))}`;
    };
    let g = `<circle class="clock-track" cx="${c}" cy="${c}" r="${R}" stroke-width="${w}" fill="none"/>`;
    for (let h = 0; h < 24; h++) {
      const a = (h / 24) * Math.PI * 2 - Math.PI / 2, major = h % 6 === 0;
      const r0 = R - w / 2 - (major ? 9 : 5), r2 = R - w / 2 - 3;
      g += `<line class="${major ? 'tick-major' : 'tick'}" x1="${r1(c + r0 * Math.cos(a))}" y1="${r1(c + r0 * Math.sin(a))}" x2="${r1(c + r2 * Math.cos(a))}" y2="${r1(c + r2 * Math.sin(a))}"/>`;
      if (major) g += `<text class="ax" x="${r1(c + (R - 34) * Math.cos(a))}" y="${r1(c + (R - 34) * Math.sin(a) + 4)}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`;
    }
    blocks.forEach((b) => { if (b.b - b.a > 60000) g += `<path class="${b.type === 'nap' ? 'arc-nap' : 'arc-night'}" d="${arc(b.a, b.b, R)}" stroke-width="${w}" fill="none" data-tip="${U.esc(`${b.type === 'nap' ? 'Siesta' : 'Noche'}|${U.time(b.a)} – ${U.time(b.b)}`)}"/>`; });
    feeds.forEach((t) => { const a = ang(t); g += `<circle class="m-feed" cx="${r1(c + (R + w / 2 + 7) * Math.cos(a))}" cy="${r1(c + (R + w / 2 + 7) * Math.sin(a))}" r="3.4" data-tip="Toma|${U.time(t)}"/>`; });
    const a = ang(now);
    g += `<line class="clock-hand" x1="${c}" y1="${c}" x2="${r1(c + (R + 2) * Math.cos(a))}" y2="${r1(c + (R + 2) * Math.sin(a))}"/><circle class="clock-hub" cx="${c}" cy="${c}" r="4"/>`;
    return svg(S + 24, S + 24, `<g transform="translate(12 12)">${g}</g>`, 'clock');
  };
})(window.Nido = window.Nido || {});

</script>
  <script>
/* ==========================================================================
   Nido · Capa de interfaz
   Enrutador por hash, hoja inferior (formularios), confirmaciones, avisos,
   tooltip global y temporizadores en vivo.
   ========================================================================== */
(function (N) {
  'use strict';
  const { U, Store, icon } = N;
  const UI = {};
  N.UI = UI;
  N.views = {};
  N.actions = {};

  /* ---------- Navegación ---------- */
  UI.NAV = [
    { id: 'hoy', name: 'Hoy', icon: 'home', main: true },
    { id: 'sueno', name: 'Sueño', icon: 'moon', main: true, cls: 'c-sleep' },
    { id: 'tomas', name: 'Tomas', icon: 'bottle', main: true, cls: 'c-feed' },
    { id: 'blw', name: 'BLW', icon: 'leaf', main: true, cls: 'c-blw' },
    { id: 'crecimiento', name: 'Crecimiento', icon: 'ruler', cls: 'c-growth' },
    { id: 'salud', name: 'Salud', icon: 'heart', cls: 'c-health' },
    { id: 'calendario', name: 'Calendario', icon: 'calendar' },
    { id: 'hitos', name: 'Hitos y dientes', icon: 'star', cls: 'c-mile' },
    { id: 'diario', name: 'Diario', icon: 'book' },
    { id: 'informe', name: 'Informe pediatra', icon: 'file' },
    { id: 'ajustes', name: 'Ajustes', icon: 'cog' }
  ];

  UI.current = () => (location.hash || '#hoy').slice(1).split('-')[0] || 'hoy';
  UI.go = (id) => { if (location.hash !== '#' + id) location.hash = id; else UI.render(); };

  UI.renderNav = () => {
    const cur = UI.current();
    const b = N.S.baby();
    const side = document.getElementById('sidenav');
    side.innerHTML = `
      <a class="brand" href="#hoy" aria-label="Nido, inicio">${UI.logo()}<span>Nido</span></a>
      <button class="baby-chip" data-act="switch-baby" type="button">
        <span class="avatar" style="--av:${b && b.sex === 'm' ? 'var(--c-sleep)' : 'var(--c-feed)'}">${b ? U.esc(b.name[0]) : '+'}</span>
        <span class="baby-chip-txt"><b>${b ? U.esc(b.name) : 'Añadir bebé'}</b><small>${b ? U.ageText(b.birth) : ''}</small></span>
        ${icon('right', 'chev')}
      </button>
      <nav class="side-links">${UI.NAV.map((n) => `
        <a href="#${n.id}" class="side-link ${n.cls || ''} ${cur === n.id ? 'on' : ''}" ${cur === n.id ? 'aria-current="page"' : ''}>${icon(n.icon)}<span>${n.name}</span></a>`).join('')}
      </nav>
      <p class="side-foot">Registrando como <button type="button" class="link" data-act="caregiver">${U.esc(Store.state.settings.caregiver)}</button></p>`;
    const tab = document.getElementById('tabbar');
    const main = UI.NAV.filter((n) => n.main);
    const inMore = !main.some((n) => n.id === cur);
    tab.innerHTML = main.map((n) => `<a href="#${n.id}" class="tab ${n.cls || ''} ${cur === n.id ? 'on' : ''}">${icon(n.icon)}<span>${n.name}</span></a>`).join('') +
      `<button type="button" class="tab ${inMore ? 'on' : ''}" data-act="more">${icon('grid')}<span>Más</span></button>`;
  };

  UI.logo = () => `<svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M6 22c0 8 6.3 13 14 13s14-5 14-13" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M9 24c2 5 6 7.5 11 7.5s9-2.5 11-7.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="14.5" cy="19" rx="4.4" ry="5.4" fill="var(--c-sleep)"/><ellipse cx="25" cy="18" rx="5" ry="6.2" fill="var(--c-feed)"/>
    <ellipse cx="20" cy="21.5" rx="4.2" ry="5" fill="var(--c-blw)"/></svg>`;

  UI.render = () => {
    const id = UI.current();
    const view = N.views[id] || N.views.hoy;
    const main = document.getElementById('view');
    UI.renderNav();
    if (!N.S.baby() && id !== 'ajustes') { main.innerHTML = N.views.bienvenida.render(); return; }
    const y = window.scrollY, same = main.dataset.view === id;
    main.dataset.view = id;
    main.innerHTML = view.render();
    if (view.mount) view.mount(main);
    UI.tick();
    if (same) window.scrollTo(0, y); else window.scrollTo(0, 0);
    document.title = `${N.S.baby() ? N.S.baby().name + ' · ' : ''}Nido`;
  };

  /* ---------- Cabecera de vista ---------- */
  UI.head = (title, sub, actions = '') => `<header class="vhead"><div><h1>${title}</h1>${sub ? `<p class="vsub">${sub}</p>` : ''}</div><div class="vhead-act">${actions}</div></header>`;
  UI.seg = (name, options, value) => `<div class="seg" role="tablist">${options.map(([v, l]) => `<button type="button" role="tab" class="${v === value ? 'on' : ''}" aria-selected="${v === value}" data-act="seg" data-seg="${name}" data-val="${v}">${l}</button>`).join('')}</div>`;
  UI.empty = (ic, title, text, btn = '') => `<div class="empty">${icon(ic)}<b>${title}</b><p>${text}</p>${btn}</div>`;
  UI.pill = (txt, tone = '') => `<span class="pill ${tone}">${txt}</span>`;
  /* Estado local de vistas (pestañas internas, filtros, mes visible…) */
  UI.st = { seg: {}, calMonth: null, calDay: null, foodFilter: 'all', foodQuery: '', growthMetric: 'weight', sleepRange: 7 };

  /* ---------- Hoja inferior ---------- */
  const sheetRoot = () => document.getElementById('sheet');
  UI.sheet = ({ title, body, submit = 'Guardar', onSubmit, onDelete, wide, onMount, footer }) => {
    const root = sheetRoot();
    root.innerHTML = `
      <div class="scrim" data-act="close-sheet"></div>
      <form class="sheet ${wide ? 'wide' : ''}" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grip" aria-hidden="true"></div>
        <header class="sheet-head"><h2 id="sheet-title">${title}</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Cerrar">${icon('x')}</button></header>
        <div class="sheet-body">${body}</div>
        ${footer !== false ? `<footer class="sheet-foot">
          ${onDelete ? `<button type="button" class="btn ghost danger" data-act="sheet-delete">${icon('trash')}Eliminar</button>` : '<span></span>'}
          ${onSubmit ? `<button type="submit" class="btn primary">${submit}</button>` : ''}
        </footer>` : ''}
      </form>`;
    root.hidden = false;
    document.body.classList.add('locked');
    const form = root.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();

  UI.confirm = (title, text, yes, onYes) => {
    UI.sheet({ title, body: `<p class="confirm-text">${text}</p>`, submit: yes, onSubmit: () => { onYes(); } });
    sheetRoot().querySelector('button[type=submit]').classList.add('danger-solid');
  };

  /* ---------- Campos de formulario ---------- */
  const fid = (n) => 'f-' + n.replace(/\W/g, '');
  UI.f = {
    text: (name, label, val = '', attrs = '') => `<label class="fld"><span>${label}</span><input id="${fid(name)}" name="${name}" value="${U.esc(val)}" ${attrs}></label>`,
    num: (name, label, val = '', attrs = '', unit = '') => `<label class="fld"><span>${label}</span><span class="unit-wrap"><input id="${fid(name)}" name="${name}" type="number" inputmode="decimal" value="${val == null ? '' : val}" ${attrs}>${unit ? `<i>${unit}</i>` : ''}</span></label>`,

    select: (name, label, opts, val) => `<label class="fld"><span>${label}</span><select id="${fid(name)}" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`,

      const on = multi ? (val || []).includes(v) : String(v) === String(val);

    }).join('')}</div></fieldset>`,

  };

  /* ---------- Avisos ---------- */
  let toastT;
  UI.toast = (msg, undo) => {
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${msg}</span>${undo ? '<button type="button" class="link" data-act="undo">Deshacer</button>' : ''}`;
    el.hidden = false; el.classList.remove('out');
    UI._undo = undo;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.hidden = true; }, 250); }, undo ? 5000 : 2600);
  };
  /* Borrado con deshacer en lugar de un diálogo de confirmación. */
  UI.removeWithUndo = (col, id, label = 'Registro eliminado') => {
    const rec = Store.get(col, id); if (!rec) return;
    const idx = Store.state[col].indexOf(rec);
    Store.remove(col, id);
    UI.toast(label, () => { Store.state[col].splice(idx, 0, rec); Store.commit(); });
  };

  /* ---------- Tooltip global ---------- */
  UI.initTooltip = () => {
    const tip = document.getElementById('tip');
    const show = (el, x, y) => {
      const [h, ...rest] = el.dataset.tip.split('|');
      tip.innerHTML = `<b>${U.esc(h)}</b>${rest.map((r) => `<span>${U.esc(r)}</span>`).join('')}`;
      tip.hidden = false;
      const w = tip.offsetWidth, hh = tip.offsetHeight;
      tip.style.left = U.clamp(x - w / 2, 8, window.innerWidth - w - 8) + 'px';
      tip.style.top = (y - hh - 14 < 8 ? y + 18 : y - hh - 14) + 'px';
    };
    document.addEventListener('pointermove', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el) show(el, e.clientX, e.clientY); else tip.hidden = true;
    });
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el && e.pointerType !== 'mouse') show(el, e.clientX, e.clientY);
    });
    window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
  };

  /* ---------- Temporizadores en vivo ---------- */
  UI.tick = () => {
    document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = U.clock(Date.now() - Number(el.dataset.since)); });
    document.querySelectorAll('[data-ago]').forEach((el) => { el.textContent = U.ago(Number(el.dataset.ago)); });
    const b = N.S.activeBreast();
    if (b) document.querySelectorAll('[data-breast]').forEach((el) => {
      const side = el.dataset.breast;
      const acc = (side === 'L' ? b.accL : b.accR) + (b.side === side && b.running ? Date.now() - b.since : 0);
      el.textContent = U.clock(acc);
    });
  };

  /* ---------- Tema ---------- */
  UI.applyTheme = () => {
    const t = Store.state.settings.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  };
})(window.Nido = window.Nido || {});

</script>
  <script>
/* ==========================================================================
   Nido · Acciones y formularios
   Cada registro se crea y edita desde una hoja inferior. Las acciones se
   disparan por delegación con `data-act`.
   ========================================================================== */
(function (N) {
  'use strict';
  const { U, S, Store, UI, icon } = N;
  const { f } = UI;
  const A = N.actions;
  const F = {};
  N.Forms = F;

  const splitDT = (t) => [U.dateInput(t), U.timeInput(t)];

  /* ======================= Sueño ======================= */
  F.sleep = (rec) => {
    const now = Date.now();
    const s = rec || { start: now - 60 * U.MIN, end: now, type: new Date(now).getHours() >= 19 || new Date(now).getHours() < 7 ? 'night' : 'nap', place: 'Cuna', quality: 3 };
    const [d0, t0] = splitDT(s.start);
    UI.sheet({
      title: rec ? 'Editar sueño' : 'Registrar sueño',
      body: f.chips('type', 'Tipo', [['nap', 'Siesta'], ['night', 'Noche']], s.type) +
        f.row(f.date('d0', 'Empezó', d0), f.time('t0', 'Hora', t0), f.time('t1', 'Se despertó', U.timeInput(s.end))) +
        f.row(f.select('place', 'Dónde', N.SLEEP_PLACES.map((p) => [p, p]), s.place), f.select('quality', 'Cómo durmió', [[3, 'Bien'], [2, 'Regular'], [1, 'Mal']], s.quality)) +
        f.area('note', 'Nota', s.note, 'Ej.: se durmió al pecho, ruido en la calle…'),
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('sleeps', rec.id, 'Sueño eliminado'); }),
      onSubmit: (d) => {
        const start = U.fromInputs(d.d0, d.t0);
        let end = U.fromInputs(d.d0, d.t1);
        if (end <= start) end += U.DAY;
        const data = { start, end, type: d.type, place: d.place, quality: +d.quality, note: d.note };
        rec ? Store.update('sleeps', rec.id, data) : Store.add('sleeps', data);
        UI.toast(`${d.type === 'nap' ? 'Siesta' : 'Sueño nocturno'} de ${U.dur((end - start) / U.MIN)} guardado`);
      }
    });
  };
  A['sleep-start'] = () => { Store.state.timers.sleep = { babyId: Store.state.activeBabyId, start: Date.now() }; Store.commit(); UI.toast('A dormir. Cronómetro en marcha'); };
  A['sleep-stop'] = () => {
    const t = S.activeSleep(); if (!t) return;
    const end = Date.now(), h = new Date(t.start).getHours();
    delete Store.state.timers.sleep;
    if (end - t.start < U.MIN) { Store.commit(); UI.toast('Cronómetro descartado (menos de 1 min)'); return; }
    const rec = Store.add('sleeps', { start: t.start, end, type: h >= 19 || h < 6 ? 'night' : 'nap', place: 'Cuna', quality: 3 });
    UI.toast(`Ha dormido ${U.dur((end - t.start) / U.MIN)}`, () => Store.remove('sleeps', rec.id));
  };
  A['sleep-cancel'] = () => { delete Store.state.timers.sleep; Store.commit(); };

  /* ======================= Tomas ======================= */
  F.feed = (rec, kind) => {
    const r = rec || { time: Date.now(), kind: kind || 'breast', durL: 10, durR: 8, ml: 120, milk: 'materna', lastSide: 'R' };
    const [d, t] = splitDT(r.time);
    const form = UI.sheet({
      title: rec ? 'Editar toma' : 'Registrar toma',
      body: f.chips('kind', 'Tipo', [['breast', 'Pecho'], ['bottle', 'Biberón']], r.kind) +
        f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) +
        `<div class="only-breast">${f.row(f.num('durL', 'Izquierdo', r.durL, 'min="0" max="120"', 'min'), f.num('durR', 'Derecho', r.durR, 'min="0" max="120"', 'min'))}
        ${f.chips('lastSide', 'Terminó en', [['L', 'Izquierdo'], ['R', 'Derecho']], r.lastSide || 'R')}</div>
        <div class="only-bottle">${f.row(f.num('ml', 'Cantidad', r.ml, 'min="0" max="400" step="5"', 'ml'), f.select('milk', 'Leche', [['materna', 'Materna'], ['formula', 'Fórmula'], ['mixta', 'Mixta']], r.milk))}</div>` +
        f.area('note', 'Nota', r.note),
      onMount: (form) => {
        const sync = () => { const k = form.querySelector('[name=kind]:checked').value; form.dataset.kind = k; };
        form.addEventListener('change', sync); sync();
      },
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('feeds', rec.id, 'Toma eliminada'); }),
      onSubmit: (x) => {
        const data = { time: U.fromInputs(x.d, x.t), kind: x.kind, note: x.note };
        if (x.kind === 'breast') Object.assign(data, { durL: +x.durL || 0, durR: +x.durR || 0, lastSide: x.lastSide });
        else Object.assign(data, { ml: +x.ml || 0, milk: x.milk });
        rec ? Store.update('feeds', rec.id, data) : Store.add('feeds', data);
        UI.toast('Toma guardada');
      }
    });
    return form;
  };
  /* Cronómetro de pecho con cambio de lado y pausa. */
  A['breast-start'] = (el) => {
    const side = el.dataset.side || (S.lastBreastSide() === 'L' ? 'R' : 'L');
    Store.state.timers.breast = { babyId: Store.state.activeBabyId, start: Date.now(), side, running: true, since: Date.now(), accL: 0, accR: 0 };
    Store.commit(); UI.closeSheet();
  };
  const bank = (b) => { if (b.running) { b[b.side === 'L' ? 'accL' : 'accR'] += Date.now() - b.since; b.since = Date.now(); } };
  A['breast-side'] = (el) => {
    const b = S.activeBreast(); if (!b) return;
    bank(b); b.side = el.dataset.side; b.running = true; b.since = Date.now(); Store.commit();
  };
  A['breast-pause'] = () => { const b = S.activeBreast(); if (!b) return; bank(b); b.running = !b.running; b.since = Date.now(); Store.commit(); };
  A['breast-stop'] = () => {
    const b = S.activeBreast(); if (!b) return; bank(b);
    delete Store.state.timers.breast;
    const durL = Math.round(b.accL / U.MIN), durR = Math.round(b.accR / U.MIN);
    if (durL + durR === 0) { Store.commit(); UI.toast('Toma descartada (menos de 1 min)'); return; }
    const rec = Store.add('feeds', { time: b.start, kind: 'breast', durL, durR, lastSide: b.side });
    UI.toast(`Toma de ${durL + durR} min guardada`, () => Store.remove('feeds', rec.id));
  };
  A['breast-cancel'] = () => { delete Store.state.timers.breast; Store.commit(); };

  F.pump = (rec) => {
    const r = rec || { time: Date.now(), ml: 100, side: 'B' };
    const [d, t] = splitDT(r.time);
    UI.sheet({
      title: rec ? 'Editar extracción' : 'Registrar extracción',
      body: f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) + f.row(f.num('ml', 'Cantidad', r.ml, 'min="0" step="5"', 'ml'), f.select('side', 'Pecho', [['B', 'Ambos'], ['L', 'Izquierdo'], ['R', 'Derecho']], r.side)),
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('pumps', rec.id); }),
      onSubmit: (x) => { const data = { time: U.fromInputs(x.d, x.t), ml: +x.ml, side: x.side }; rec ? Store.update('pumps', rec.id, data) : Store.add('pumps', data); UI.toast('Extracción guardada'); }
    });
  };

  /* ======================= Pañales ======================= */
  F.diaper = (rec, kind) => {
    const r = rec || { time: Date.now(), kind: kind || 'wet', color: 'amarillo' };
    const [d, t] = splitDT(r.time);
    UI.sheet({
      title: rec ? 'Editar pañal' : 'Registrar pañal',
      body: f.chips('kind', 'Contenido', [['wet', 'Pipí'], ['dirty', 'Caca'], ['mixed', 'Pipí y caca']], r.kind) +
        f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) +
        `<div class="only-poo"><fieldset class="fld full"><legend>Color de la caca</legend><div class="chips">${N.DIAPER_COLORS.map((c) => `<label class="chip"><input type="radio" name="color" value="${c.id}" ${r.color === c.id ? 'checked' : ''}><span><i class="swatch" style="background:${c.hex}"></i>${c.name}</span></label>`).join('')}</div><p class="hint">Negro (pasados los primeros días), blanco o con sangre: consulta con tu pediatra.</p></fieldset></div>` +
        f.area('note', 'Nota', r.note),
      onMount: (form) => { const sync = () => { form.dataset.kind = form.querySelector('[name=kind]:checked').value; }; form.addEventListener('change', sync); sync(); },
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('diapers', rec.id, 'Pañal eliminado'); }),
      onSubmit: (x) => {
        const data = { time: U.fromInputs(x.d, x.t), kind: x.kind, color: x.kind === 'wet' ? null : x.color || 'amarillo', note: x.note };
        rec ? Store.update('diapers', rec.id, data) : Store.add('diapers', data);
        UI.toast('Pañal guardado');
      }
    });
  };
  A['diaper-quick'] = (el) => {
    const rec = Store.add('diapers', { time: Date.now(), kind: el.dataset.kind, color: el.dataset.kind === 'wet' ? null : 'amarillo' });
    UI.closeSheet();
    UI.toast(`Pañal (${{ wet: 'pipí', dirty: 'caca', mixed: 'pipí y caca' }[el.dataset.kind]}) guardado`, () => Store.remove('diapers', rec.id));
  };

  /* ======================= Comidas BLW ======================= */
  F.meal = (rec, preset) => {
    const now = Date.now(), h = new Date(now).getHours();
    const r = rec || { time: now, mealType: h < 11 ? 'desayuno' : h < 16 ? 'comida' : h < 19 ? 'merienda' : 'cena', foods: preset ? [{ id: preset, amount: 1, liked: 0, reaction: 'none' }] : [], gag: false, choke: false };
    const sel = r.foods.map((x) => Object.assign({}, x));
    const stats = S.foodStats();
    const [d, t] = splitDT(r.time);
    const foodBtn = (fd) => {
      const on = sel.some((x) => x.id === fd.id), stt = stats[fd.id];
      return `<button type="button" class="food-pick ${on ? 'on' : ''}" data-food="${fd.id}" data-name="${U.esc(fd.name.toLowerCase())}">
        <span class="fe">${fd.emoji}</span><span>${fd.name}</span>${fd.a ? '<i class="dot-al" title="Alérgeno"></i>' : ''}${stt ? '<i class="tried" title="Ya lo ha probado">✓</i>' : ''}</button>`;
    };
    const selRow = (x) => {
      const fd = N.FOOD_BY_ID[x.id];
      return `<div class="sel-food" data-id="${x.id}">
        <div class="sel-food-h"><span class="fe">${fd.emoji}</span><b>${fd.name}</b>${fd.a ? UI.pill('Alérgeno', 'warn') : ''}<button type="button" class="icon-btn sm" data-unpick="${x.id}" aria-label="Quitar ${fd.name}">${icon('x')}</button></div>
        <div class="sel-food-c">
          <select name="amount_${x.id}" aria-label="Cantidad">${N.EAT_AMOUNT.map((l, i) => `<option value="${i}" ${x.amount === i ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <div class="likes" role="radiogroup" aria-label="¿Le gustó?">${[[1, '😋', 'Le gustó'], [0, '😐', 'Normal'], [-1, '😖', 'No le gustó']].map(([v, e, l]) => `<label title="${l}"><input type="radio" name="liked_${x.id}" value="${v}" ${x.liked === v ? 'checked' : ''}><span>${e}</span></label>`).join('')}</div>
          <select name="reaction_${x.id}" aria-label="Reacción">${Object.entries(N.REACTIONS).map(([k, v]) => `<option value="${k}" ${x.reaction === k ? 'selected' : ''}>${v.name}</option>`).join('')}</select>
        </div>
        ${fd.s6 ? `<p class="hint">${icon('info')} ${S.ageMonths() < 9 ? fd.s6 : fd.s9}${fd.r ? ' · <b>Preparar con cuidado: riesgo de atragantamiento</b>' : ''}</p>` : ''}
      </div>`;
    };
    UI.sheet({
      title: rec ? 'Editar comida' : 'Nueva comida',
      wide: true,
      body: f.chips('mealType', 'Comida', N.MEAL_TYPES.map((m) => [m.id, m.name]), r.mealType) +
        f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) +
        `<div class="fld full"><span>Alimentos</span><div id="sel-foods" class="sel-foods"></div>
          <input type="search" id="food-q" class="food-q" placeholder="Buscar alimento (${N.FOODS.length} en el catálogo)…" autocomplete="off">
          <div class="food-grid" id="food-grid">${N.FOODS.map(foodBtn).join('')}</div></div>` +
        `<fieldset class="fld full"><legend>Durante la comida</legend><div class="chips">
          <label class="chip"><input type="checkbox" name="gag" ${r.gag ? 'checked' : ''}><span>Hizo arcadas</span></label>
          <label class="chip"><input type="checkbox" name="choke" ${r.choke ? 'checked' : ''}><span>Atragantamiento</span></label></div>
          <p class="hint">Las arcadas son un reflejo protector y normales al empezar. El atragantamiento es silencioso: si ocurre, actúa y anótalo.</p></fieldset>` +
        f.area('note', 'Nota', r.note, 'Texturas, cómo lo cogió, si usó cuchara precargada…'),
      onMount: (form) => {
        const list = form.querySelector('#sel-foods');
        const paint = () => {
          // Conserva lo que ya se había elegido en los controles antes de repintar
          sel.forEach((x) => {
            const a = form.querySelector(`[name=amount_${x.id}]`), l = form.querySelector(`[name=liked_${x.id}]:checked`), re = form.querySelector(`[name=reaction_${x.id}]`);
            if (a) x.amount = +a.value; if (l) x.liked = +l.value; if (re) x.reaction = re.value;
          });
          list.innerHTML = sel.length ? sel.map(selRow).join('') : '<p class="hint">Elige uno o varios alimentos del catálogo.</p>';
          form.querySelectorAll('.food-pick').forEach((b) => b.classList.toggle('on', sel.some((x) => x.id === b.dataset.food)));
        };
        paint();
        form.addEventListener('click', (e) => {
          const p = e.target.closest('.food-pick'), u = e.target.closest('[data-unpick]');
          if (p) {
            const id = p.dataset.food, i = sel.findIndex((x) => x.id === id);
            if (i >= 0) sel.splice(i, 1); else sel.push({ id, amount: 1, liked: 0, reaction: 'none' });
            paint();
          }
          if (u) { sel.splice(sel.findIndex((x) => x.id === u.dataset.unpick), 1); paint(); }
        });
        form.querySelector('#food-q').addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
          form.querySelectorAll('.food-pick').forEach((b) => { b.hidden = q && !b.dataset.name.normalize('NFD').replace(/\p{Diacritic}/gu, '').includes(q); });
        });
      },
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('meals', rec.id, 'Comida eliminada'); }),
      onSubmit: (x, form) => {
        if (!sel.length) { UI.toast('Añade al menos un alimento'); return false; }
        const foods = sel.map((s) => ({
          id: s.id, amount: +(x['amount_' + s.id] ?? s.amount), liked: +(x['liked_' + s.id] ?? s.liked), reaction: x['reaction_' + s.id] || s.reaction
        }));
        const data = { time: U.fromInputs(x.d, x.t), mealType: x.mealType, foods, gag: !!x.gag, choke: !!x.choke, note: x.note };
        const firsts = foods.filter((fd) => !stats[fd.id]).map((fd) => N.FOOD_BY_ID[fd.id].name);
        rec ? Store.update('meals', rec.id, data) : Store.add('meals', data);
        UI.toast(firsts.length && !rec ? `Primera vez: ${firsts.join(', ')}` : 'Comida guardada');
        if (foods.some((fd) => fd.reaction === 'strong')) setTimeout(() => UI.toast('Reacción importante anotada. Si hay dificultad para respirar, llama al 112'), 2700);
      }
    });
  };

  /* ======================= Crecimiento ======================= */
  F.measure = (rec) => {
    const last = { weight: S.lastMeasure('weight'), length: S.lastMeasure('length'), head: S.lastMeasure('head') };
    const r = rec || { date: U.today() };
    const b = S.baby();
    UI.sheet({
      title: rec ? 'Editar medida' : 'Nueva medida',
      body: f.date('date', 'Fecha', r.date) +
        f.row(
          f.num('weight', 'Peso', r.weight, `step="0.01" min="1" max="30" placeholder="${last.weight ? U.num(last.weight.weight, 2) : ''}"`, 'kg'),
          f.num('length', 'Longitud', r.length, `step="0.1" min="30" max="120" placeholder="${last.length ? U.num(last.length.length, 1) : ''}"`, 'cm'),
          f.num('head', 'P. craneal', r.head, `step="0.1" min="25" max="60" placeholder="${last.head ? U.num(last.head.head, 1) : ''}"`, 'cm')) +
        '<div id="pc-preview" class="pc-preview"></div>' +
        f.area('note', 'Nota', r.note, 'Dónde se midió, con o sin ropa…'),
      onMount: (form) => {
        const prev = form.querySelector('#pc-preview');
        const upd = () => {
          const d = UI.formData(form); const age = U.age(b.birth, U.parseDay(d.date || U.today())).decimal;
          prev.innerHTML = ['weight', 'length', 'head'].map((k) => {
            const v = parseFloat(d[k]); if (!v) return '';
            const p = S.percentile(k, b.sex, age, v);
            return `<span>${N.METRICS[k].short}: <b>P${Math.round(p)}</b></span>`;
          }).join('');
        };
        form.addEventListener('input', upd); upd();
      },
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('measures', rec.id, 'Medida eliminada'); }),
      onSubmit: (x) => {
        const val = (k) => (x[k] ? parseFloat(String(x[k]).replace(',', '.')) : null);
        const data = { date: x.date, weight: val('weight'), length: val('length'), head: val('head'), note: x.note };
        if (!data.weight && !data.length && !data.head) { UI.toast('Introduce al menos una medida'); return false; }
        rec ? Store.update('measures', rec.id, data) : Store.add('measures', data);
        UI.toast('Medida guardada');
      }
    });
  };

  /* ======================= Salud ======================= */
  F.appt = (rec, preset = {}) => {
    const r = rec || Object.assign({ date: U.dayKey(U.addDays(Date.now(), 7)), time: '10:00', type: 'revision', title: '', place: S.baby().center || '', doctor: S.baby().pediatrician || '', questions: [], done: false }, preset);
    UI.sheet({
      title: rec ? 'Editar cita' : 'Nueva cita',
      body: f.text('title', 'Motivo', r.title, 'required placeholder="Revisión 9 meses, vacuna, dermatología…"') +
        f.row(f.date('date', 'Día', r.date), f.time('time', 'Hora', r.time), f.select('type', 'Tipo', Object.entries(N.APPT_TYPES).map(([k, v]) => [k, v.name]), r.type)) +
        f.row(f.text('place', 'Lugar', r.place), f.text('doctor', 'Profesional', r.doctor)) +
        f.area('questions', 'Preguntas para la consulta (una por línea)', (r.questions || []).map((q) => q.text).join('\n'), '¿Cuándo introducir el huevo entero?') +
        `<label class="chip solo"><input type="checkbox" name="done" ${r.done ? 'checked' : ''}><span>Cita realizada</span></label>` +
        f.area('outcome', 'Qué nos dijeron', r.outcome, 'Indicaciones, próximas pruebas, dosis…'),
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('appointments', rec.id, 'Cita eliminada'); }),
      onSubmit: (x) => {
        if (!x.title.trim()) { UI.toast('Escribe el motivo de la cita'); return false; }
        const prevQ = Object.fromEntries((r.questions || []).map((q) => [q.text, q.done]));
        const questions = x.questions.split('\n').map((s) => s.trim()).filter(Boolean).map((text) => ({ text, done: !!prevQ[text] }));
        const data = { title: x.title.trim(), date: x.date, time: x.time, type: x.type, place: x.place, doctor: x.doctor, questions, done: !!x.done, outcome: x.outcome };
        rec ? Store.update('appointments', rec.id, data) : Store.add('appointments', data);
        UI.toast(rec ? 'Cita actualizada' : `Cita guardada para ${U.relDay(x.date)}`);
      }
    });
  };
  A['q-toggle'] = (el) => {
    const a = Store.get('appointments', el.dataset.id); if (!a) return;
    a.questions[+el.dataset.i].done = !a.questions[+el.dataset.i].done; Store.commit();
  };
  F.vaccine = (code) => {
    const v = N.VACCINES.find((x) => x.id === code); const g = S.vaccineMap()[code];
    UI.sheet({
      title: v.name,
      body: `<p class="hint">${v.detail || 'Dosis del calendario común.'}</p>` + f.row(f.date('date', 'Fecha de administración', g ? g.date : U.today()), f.text('lot', 'Lote (opcional)', g ? g.lot : '')) + f.area('note', 'Reacción u observaciones', g ? g.note : '', 'Fiebre, irritabilidad, bultito en la zona…'),
      submit: g ? 'Guardar' : 'Marcar como puesta',
      onDelete: g && (() => { UI.closeSheet(); UI.removeWithUndo('vaccines', g.id, 'Vacuna desmarcada'); }),
      onSubmit: (x) => { const data = { code, date: x.date, lot: x.lot, note: x.note }; g ? Store.update('vaccines', g.id, data) : Store.add('vaccines', data); UI.toast(`${v.name} registrada`); }
    });
  };
  F.med = (rec) => {
    const recent = [...new Set(Store.list('meds').map((m) => m.name))];
    const r = rec || { time: Date.now(), name: '', dose: '', unit: 'ml' };
    const [d, t] = splitDT(r.time);
    UI.sheet({
      title: rec ? 'Editar medicación' : 'Registrar medicación',
      body: `<label class="fld full"><span>Medicamento</span><input id="f-medname" name="name" list="med-list" value="${U.esc(r.name)}" required placeholder="Paracetamol, vitamina D…"><datalist id="med-list">${recent.map((n) => `<option value="${U.esc(n)}">`).join('')}</datalist></label>` +
        f.row(f.num('dose', 'Dosis', r.dose, 'step="0.1" min="0"'), f.select('unit', 'Unidad', [['ml', 'ml'], ['gotas', 'gotas'], ['mg', 'mg'], ['UI', 'UI'], ['sobre', 'sobre']], r.unit)) +
        f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) + f.text('reason', 'Motivo', r.reason, 'placeholder="Fiebre, suplemento…"') +
        '<p class="hint">Consulta siempre la dosis por peso con tu pediatra o farmacéutico.</p>',
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('meds', rec.id); }),
      onSubmit: (x) => {
        if (!x.name.trim()) { UI.toast('Escribe el nombre del medicamento'); return false; }
        const data = { time: U.fromInputs(x.d, x.t), name: x.name.trim(), dose: parseFloat(x.dose) || null, unit: x.unit, reason: x.reason };

  F.temp = (rec) => {
    const r = rec || { time: Date.now(), value: 37.0, method: 'Axilar' };

      title: rec ? 'Editar temperatura' : 'Registrar temperatura',
      body: f.row(f.num('value', 'Temperatura', r.value, 'step="0.1" min="34" max="43"', 'ºC'), f.select('method', 'Medición', [['Axilar', 'Axilar'], ['Rectal', 'Rectal'], ['Oído', 'Oído'], ['Frente', 'Frente']], r.method)) +
        f.row(f.date('d', 'Día', d), f.time('t', 'Hora', t)) +
        '<p class="hint">Fiebre: 38 ºC o más. En menores de 3 meses, cualquier fiebre es motivo de consulta urgente.</p>',
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('temps', rec.id); }),
      onSubmit: (x) => {
        const v = parseFloat(String(x.value).replace(',', '.'));
        const data = { time: U.fromInputs(x.d, x.t), value: v, method: x.method };
        rec ? Store.update('temps', rec.id, data) : Store.add('temps', data);
        UI.toast(v >= 38 ? `${U.num(v)} ºC: tiene fiebre` : `${U.num(v)} ºC guardado`);
      }
    });

  /* ======================= Agenda, diario, hitos ======================= */
  F.event = (rec, date) => {
    const r = rec || { date: date || U.today(), time: '', title: '' };
    UI.sheet({
      title: rec ? 'Editar evento' : 'Nuevo evento',
      body: f.text('title', 'Qué', r.title, 'required placeholder="Visita de los abuelos, guardería…"') + f.row(f.date('date', 'Día', r.date), `<label class="fld"><span>Hora (opcional)</span><input id="f-evtime" name="time" type="time" value="${r.time || ''}"></label>`),
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('events', rec.id, 'Evento eliminado'); }),
      onSubmit: (x) => { if (!x.title.trim()) { UI.toast('Escribe un título'); return false; } const data = { title: x.title.trim(), date: x.date, time: x.time }; rec ? Store.update('events', rec.id, data) : Store.add('events', data); UI.toast('Evento guardado'); }
    });
  };
  /* Reduce la foto a 1000 px para que quepa en el almacenamiento local. */
  const shrink = (file) => new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = rd.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
  F.diary = (rec) => {
    const r = rec || { date: U.today(), mood: 'feliz', text: '', photo: null };
    let photo = r.photo;
    UI.sheet({
      title: rec ? 'Editar recuerdo' : 'Nuevo recuerdo',
      body: f.date('date', 'Día', r.date) + f.chips('mood', 'Cómo estaba', N.MOODS.map((m) => [m.id, `${m.emoji} ${m.name}`]), r.mood) +
        f.area('text', 'Qué pasó', r.text, 'Una primera vez, una frase, algo que no quieres olvidar…') +
        `<div class="fld full"><span>Foto</span><label class="photo-drop" id="photo-drop">${photo ? `<img src="${photo}" alt="">` : `${icon('camera')}<span>Añadir foto</span>`}<input type="file" id="f-photo" accept="image/*" hidden></label></div>`,
      onMount: (form) => {
        form.addEventListener('change', async (e) => {
          if (e.target.id !== 'f-photo') return;
          const file = e.target.files[0]; if (!file) return;
          try { photo = await shrink(file); form.querySelector('#photo-drop').innerHTML = `<img src="${photo}" alt=""><input type="file" id="f-photo" accept="image/*" hidden>`; }
          catch (err) { UI.toast('No se pudo leer la imagen'); }
        });
      },
      onDelete: rec && (() => { UI.closeSheet(); UI.removeWithUndo('diary', rec.id, 'Recuerdo eliminado'); }),
      onSubmit: (x) => {
        if (!x.text.trim() && !photo) { UI.toast('Escribe algo o añade una foto'); return false; }
        const data = { date: x.date, mood: x.mood, text: x.text.trim(), photo };
        rec ? Store.update('diary', rec.id, data) : Store.add('diary', data);
        UI.toast(Store.persistent ? 'Recuerdo guardado' : 'Guardado en esta sesión (el navegador no permite almacenamiento)');
      }
    });
  };
  F.milestone = (id) => {
    const m = N.MILESTONES.find((x) => x.id === id); const map = Store.babyMap('milestones');
    UI.sheet({
      title: m.name, body: `<p class="hint">Suele aparecer entre los ${m.from} y los ${m.to} meses. Cada bebé tiene su ritmo.</p>` + f.date('date', '¿Cuándo?', map[id] || U.today()),
      submit: map[id] ? 'Guardar' : '¡Conseguido!',
      onDelete: map[id] && (() => { delete map[id]; Store.commit(); UI.closeSheet(); UI.toast('Hito desmarcado'); }),
      onSubmit: (x) => { map[id] = x.date; Store.commit(); UI.toast(`${m.name} ✓`); }
    });
  };
  F.tooth = (id) => {
    const all = [...N.TEETH.upper, ...N.TEETH.lower]; const tt = all.find((x) => x.id === id); const map = Store.babyMap('teeth');
    UI.sheet({
      title: tt.name, body: `<p class="hint">Diente ${tt.id} · erupción habitual: ${tt.m} meses.</p>` + f.date('date', '¿Cuándo salió?', map[id] || U.today()),
      submit: map[id] ? 'Guardar' : 'Ha salido',
      onDelete: map[id] && (() => { delete map[id]; Store.commit(); UI.closeSheet(); }),
      onSubmit: (x) => { map[id] = x.date; Store.commit(); UI.toast('Diente registrado'); }
    });
  };

  /* ======================= Bebés ======================= */
  F.baby = (rec) => {
    const r = rec || { name: '', sex: 'f', birth: U.today() };
    UI.sheet({
      title: rec ? `Perfil de ${U.esc(rec.name)}` : 'Añadir bebé',
      body: f.text('name', 'Nombre', r.name, 'required autocomplete="off"') +
        f.row(f.chips('sex', 'Sexo (para las curvas OMS)', [['f', 'Niña'], ['m', 'Niño']], r.sex), f.date('birth', 'Fecha de nacimiento', r.birth)) +
        f.row(f.num('birthWeight', 'Peso al nacer', r.birthWeight, 'step="0.01"', 'kg'), f.num('birthLength', 'Longitud', r.birthLength, 'step="0.1"', 'cm'), f.num('birthHead', 'P. craneal', r.birthHead, 'step="0.1"', 'cm')) +
        f.row(f.text('blood', 'Grupo sanguíneo', r.blood), f.text('allergies', 'Alergias conocidas', r.allergies)) +
        f.row(f.text('pediatrician', 'Pediatra', r.pediatrician), f.text('center', 'Centro de salud', r.center)) +
        f.text('healthCard', 'Nº tarjeta sanitaria', r.healthCard) + f.area('notes', 'Notas médicas', r.notes),
      onDelete: rec && Store.state.babies.length > 1 && (() => {
        UI.confirm(`¿Eliminar a ${U.esc(rec.name)}?`, 'Se borrarán todos sus registros de este dispositivo. No se puede deshacer.', 'Eliminar', () => {
          Store.state.babies = Store.state.babies.filter((b) => b.id !== rec.id);
          Store.COLLECTIONS.forEach((c) => { Store.state[c] = Store.state[c].filter((x) => x.babyId !== rec.id); });
          Store.state.activeBabyId = Store.state.babies[0].id; Store.commit();
        });
      }),
      onSubmit: (x) => {
        if (!x.name.trim()) { UI.toast('Escribe el nombre'); return false; }
        const n = (k) => (x[k] ? parseFloat(x[k]) : null);
        const data = { name: x.name.trim(), sex: x.sex, birth: x.birth, birthWeight: n('birthWeight'), birthLength: n('birthLength'), birthHead: n('birthHead'), blood: x.blood, allergies: x.allergies, pediatrician: x.pediatrician, center: x.center, healthCard: x.healthCard, notes: x.notes };
        if (rec) { Object.assign(rec, data); Store.commit(); UI.toast('Perfil actualizado'); return; }
        const b = Object.assign({ id: U.uid() }, data);
        Store.state.babies.push(b); Store.state.activeBabyId = b.id;
        if (data.birthWeight || data.birthLength || data.birthHead) Store.state.measures.push({ id: U.uid(), babyId: b.id, date: data.birth, weight: data.birthWeight, length: data.birthLength, head: data.birthHead, note: 'Al nacer' });
        Store.commit(); UI.go('hoy'); UI.toast(`Bienvenida/o, ${b.name}`);
      }
    });
  };
  A['switch-baby'] = () => {
    const cur = Store.state.activeBabyId;
    UI.sheet({
      title: 'Bebés', footer: false,
      body: `<div class="baby-list">${Store.state.babies.map((b) => `
        <button type="button" class="baby-row ${b.id === cur ? 'on' : ''}" data-act="pick-baby" data-id="${b.id}">
          <span class="avatar" style="--av:${b.sex === 'm' ? 'var(--c-sleep)' : 'var(--c-feed)'}">${U.esc(b.name[0])}</span>
          <span><b>${U.esc(b.name)}</b><small>${U.ageText(b.birth)}</small></span>${b.id === cur ? icon('check') : ''}</button>`).join('')}
        <button type="button" class="baby-row add" data-act="new-baby"><span class="avatar">+</span><span><b>Añadir otro bebé</b><small>Hermanos, gemelos…</small></span></button></div>
        ${S.baby() ? `<button type="button" class="btn ghost full" data-act="edit-baby">${icon('edit')}Editar perfil de ${U.esc(S.baby().name)}</button>` : ''}`
    });
  };
  A['pick-baby'] = (el) => { Store.state.activeBabyId = el.dataset.id; Store.commit(); UI.closeSheet(); };
  A['new-baby'] = () => F.baby();
  A['edit-baby'] = () => F.baby(S.baby());
  A.caregiver = () => {
    const cur = Store.state.settings.caregiver;
    const opts = ['Mamá', 'Papá', 'Abuela', 'Abuelo', 'Canguro'];
    UI.sheet({
      title: '¿Quién está registrando?',
      body: f.chips('who', 'Cuidador', (opts.includes(cur) ? opts : [...opts, cur]).map((o) => [o, o]), cur) + f.text('other', 'Otro nombre', '', 'placeholder="Tía Ana"') + '<p class="hint">Cada registro guarda quién lo hizo, útil cuando os turnáis por la noche.</p>',
      onSubmit: (x) => { Store.state.settings.caregiver = x.other.trim() || x.who; Store.commit(); }
    });
  };

  /* ======================= Registro rápido y menú ======================= */
  A['quick-add'] = () => {
    const s = S.activeSleep();
    const next = S.lastBreastSide() === 'L' ? 'R' : 'L';
    const tile = (act, ic, label, sub, cls, extra = '') => `<button type="button" class="qa ${cls}" data-act="${act}" ${extra}>${icon(ic)}<b>${label}</b><small>${sub}</small></button>`;
    UI.sheet({
      title: 'Registrar', footer: false, wide: true,
      body: `<div class="qa-grid">
        ${s ? tile('sleep-stop', 'sun', 'Se ha despertado', `Dormía desde ${U.time(s.start)}`, 'c-sleep') : tile('sleep-start', 'moon', 'A dormir', 'Inicia el cronómetro', 'c-sleep')}
        ${tile('form-sleep', 'bed', 'Sueño pasado', 'Siesta o noche', 'c-sleep')}
        ${tile('breast-start', 'breast', 'Pecho', `Empezar por el ${next === 'L' ? 'izquierdo' : 'derecho'}`, 'c-feed', `data-side="${next}"`)}
        ${tile('form-bottle', 'bottle', 'Biberón', 'Leche materna o fórmula', 'c-feed')}
        ${tile('form-meal', 'leaf', 'Comida BLW', 'Alimentos y reacciones', 'c-blw')}
        ${tile('form-diaper', 'diaper', 'Pañal', 'Pipí, caca y color', 'c-diaper')}
        ${tile('form-measure', 'ruler', 'Medida', 'Peso, talla, cabeza', 'c-growth')}
        ${tile('form-temp', 'thermo', 'Temperatura', 'Control de fiebre', 'c-health')}
        ${tile('form-med', 'pill', 'Medicación', 'Dosis y hora', 'c-health')}
        ${tile('form-appt', 'calendar', 'Cita médica', 'Con preguntas', 'c-growth')}
        ${tile('form-pump', 'pump', 'Extracción', 'Leche extraída', 'c-feed')}
        ${tile('form-diary', 'book', 'Recuerdo', 'Nota y foto', 'c-mile')}
      </div>
      <div class="qa-diapers"><span>Pañal en un toque</span>
        <button type="button" class="btn soft" data-act="diaper-quick" data-kind="wet">Pipí</button>
        <button type="button" class="btn soft" data-act="diaper-quick" data-kind="dirty">Caca</button>
        <button type="button" class="btn soft" data-act="diaper-quick" data-kind="mixed">Ambos</button></div>`
    });
  };
  A.more = () => {
    const cur = UI.current();
    UI.sheet({
      title: 'Todas las secciones', footer: false,
      body: `<nav class="more-grid">${UI.NAV.map((n) => `<a href="#${n.id}" class="more-link ${n.cls || ''} ${cur === n.id ? 'on' : ''}" data-act="close-sheet">${icon(n.icon)}<span>${n.name}</span></a>`).join('')}</nav>`
    });
  };

  /* Accesos genéricos a formularios: data-act="form-xxx" [data-id] */
  const forms = {
    sleep: (id) => F.sleep(id && Store.get('sleeps', id)),
    feed: (id) => F.feed(id && Store.get('feeds', id)),
    bottle: () => F.feed(null, 'bottle'),
    diaper: (id) => F.diaper(id && Store.get('diapers', id)),
    meal: (id, el) => F.meal(id && Store.get('meals', id), el.dataset.food),
    measure: (id) => F.measure(id && Store.get('measures', id)),
    appt: (id, el) => F.appt(id && Store.get('appointments', id), el.dataset.title ? { title: el.dataset.title, type: el.dataset.type || 'revision', date: el.dataset.date } : undefined),
    vaccine: (id, el) => F.vaccine(el.dataset.code),
    med: (id) => F.med(id && Store.get('meds', id)),
    temp: (id) => F.temp(id && Store.get('temps', id)),
    pump: (id) => F.pump(id && Store.get('pumps', id)),
    event: (id, el) => F.event(id && Store.get('events', id), el.dataset.date),
    diary: (id) => F.diary(id && Store.get('diary', id)),
    milestone: (id) => F.milestone(id),
    tooth: (id) => F.tooth(id)
  };
  Object.entries(forms).forEach(([k, fn]) => { A['form-' + k] = (el) => fn(el.dataset.id, el); });
  /* Edición desde la línea de tiempo */
  A.edit = (el) => {
    const map = { sleeps: 'sleep', feeds: 'feed', diapers: 'diaper', meals: 'meal', meds: 'med', temps: 'temp', pumps: 'pump', appointments: 'appt', events: 'event', diary: 'diary', measures: 'measure' };
    forms[map[el.dataset.col]](el.dataset.id, el);
  };

  A['close-sheet'] = () => UI.closeSheet();
  A['sheet-delete'] = () => UI._onDelete && UI._onDelete();
  A.undo = () => { if (UI._undo) { UI._undo(); UI._undo = null; document.getElementById('toast').hidden = true; } };
  A.seg = (el) => { UI.st.seg[el.dataset.seg] = el.dataset.val; UI.render(); };
  A.go = (el) => UI.go(el.dataset.to);
})(window.Nido = window.Nido || {});

</script>
  <script>
/* ==========================================================================
   Nido · Vistas del día a día: Hoy, Sueño y Tomas
   ========================================================================== */
(function (N) {
  'use strict';
  const { U, S, Store, UI, Charts, icon } = N;
  const V = N.views;
  const W = {}; // widgets compartidos
  N.W = W;

  /* ---------- Widgets ---------- */
  W.kpi = (label, value, sub = '', cls = '') => `<div class="kpi ${cls}"><span class="kpi-l">${label}</span><b class="kpi-v">${value}</b>${sub ? `<span class="kpi-s">${sub}</span>` : ''}</div>`;

  /* Tarjeta de estado en vivo: durmiendo, dando el pecho o despierto con predicción. */
  W.live = () => {
    const s = S.activeSleep(), b = S.activeBreast();
    if (b) {
      const other = b.side === 'L' ? 'R' : 'L';
      return `<section class="live live-feed">
        <div class="live-top"><span class="eyebrow">${icon('breast')} Dando el pecho · desde ${U.time(b.start)}</span>
          <button type="button" class="link" data-act="breast-cancel">Descartar</button></div>
        <div class="breast-sides">
          ${['L', 'R'].map((sd) => `<button type="button" class="side ${b.side === sd ? 'on' : ''} ${b.side === sd && b.running ? 'run' : ''}" data-act="breast-side" data-side="${sd}">
            <small>${sd === 'L' ? 'Izquierdo' : 'Derecho'}</small><b data-breast="${sd}">00:00</b></button>`).join('')}
        </div>
        <div class="live-actions">
          <button type="button" class="btn soft" data-act="breast-pause">${icon(b.running ? 'pause' : 'play')}${b.running ? 'Pausar' : 'Seguir'}</button>
          <button type="button" class="btn soft" data-act="breast-side" data-side="${other}">Cambiar a ${other === 'L' ? 'izquierdo' : 'derecho'}</button>
          <button type="button" class="btn primary" data-act="breast-stop">${icon('check')}Terminar toma</button>
        </div></section>`;
    }
    if (s) {
      return `<section class="live live-sleep night-sky">
        <div class="live-top"><span class="eyebrow">${icon('moon')} Durmiendo desde las ${U.time(s.start)}</span><button type="button" class="link" data-act="sleep-cancel">Descartar</button></div>
        <b class="live-clock" data-since="${s.start}">00:00</b>
        <div class="live-actions"><button type="button" class="btn primary" data-act="sleep-stop">${icon('sun')}Se ha despertado</button></div>
      </section>`;
    }
    const p = S.predict();
    if (!p) return `<section class="live"><div class="live-top"><span class="eyebrow">${icon('sun')} Despierta</span></div>
      <p class="muted">Registra un sueño para calcular las ventanas de vigilia.</p>
      <div class="live-actions"><button type="button" class="btn primary" data-act="sleep-start">${icon('moon')}A dormir</button></div></section>`;
    const over = p.awakeMin > p.windowRange[1];
    const pct = Math.round(U.clamp(p.progress, 0, 1) * 100);
    return `<section class="live">
      <div class="live-top"><span class="eyebrow">${icon('sun')} Despierta desde las ${U.time(p.awakeSince)}</span>${over ? UI.pill('Ventana superada', 'warn') : p.progress > 0.8 ? UI.pill('Busca señales de sueño', 'soft') : ''}</div>
      <div class="ww">
        <div class="ww-head"><b class="live-clock sm" data-since="${p.awakeSince}">00:00</b><span class="muted">de ${U.dur(p.ww)} de ventana</span></div>
        <div class="ww-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Ventana de vigilia"><i style="width:${pct}%"></i><span class="ww-mark" style="left:${Math.round((p.windowRange[0] / p.ww) * 100 * 0.999)}%"></span></div>
      </div>
      <div class="pred">
        ${p.nextNap ? `<div><small>Próxima siesta</small><b>${U.time(p.nextNap)}</b><span>${p.nextNap < Date.now() ? 'ahora' : 'en ' + U.dur((p.nextNap - Date.now()) / U.MIN)}</span></div>` : `<div><small>Siestas</small><b>${p.napsToday}/${p.expectedNaps}</b><span>completadas</span></div>`}
        <div><small>A la cama</small><b>${U.time(p.bedtime)}</b><span>aprox.</span></div>

      ${W.card('Extracciones', all.length ? `<ul class="rows">${all.map((p) => `<li><button type="button" class="row" data-act="form-pump" data-id="${p.id}"><span>${U.date(p.time)} · ${U.time(p.time)}</span><b>${p.ml} ml</b><small>${{ B: 'Ambos', L: 'Izquierdo', R: 'Derecho' }[p.side]}</small></button></li>`).join('')}</ul>` : UI.empty('pump', 'Sin extracciones', 'Registra la leche extraída para saber cuánta tienes guardada.'))}`;
    }

})(window.Nido = window.Nido || {});

  <script>
/* ==========================================================================

(function (N) {

      const weekAgo = Date.now() - 7 * U.DAY;
      const colorsWeek = new Set(); meals.filter((m) => m.time > weekAgo).forEach((m) => m.foods.forEach((f) => colorsWeek.add(N.FOOD_BY_ID[f.id].col)));
      const byCat = Object.entries(N.FOOD_CATS).map(([id, c]) => { const all = N.FOODS.filter((f) => f.c === id); return { id, ...c, total: all.length, tried: all.filter((f) => stats[f.id]).length }; });
      const reactions = Object.entries(stats).filter(([, s]) => s.reaction !== 'none');
      const gags = meals.filter((m) => m.gag).length;

      return UI.head('BLW · Alimentación complementaria', start ? `Día ${blwDay} desde el primer bocado (${U.date(start)}) · ${meals.length} comidas registradas` : 'Empieza hacia los 6 meses, cuando se sienta con apoyo', `<button type="button" class="btn primary" data-act="form-meal">${icon('plus')}Nueva comida</button>`) + `
      <div class="grid-blw">

          <ul class="cat-bars">${byCat.map((c) => `<li><span>${c.name}</span><span class="cat-track"><i style="width:${(c.tried / c.total) * 100}%;background:${c.color}"></i></span><b>${c.tried}/${c.total}</b></li>`).join('')}</ul></div></div>`, { cls: 'span-2' })}
        ${W.card('Arcoíris de la semana', `<div class="rainbow">${Object.entries(N.RAINBOW).map(([k, c]) => `<div class="rb ${colorsWeek.has(k) ? 'on' : ''}" data-tip="${c.name}|${colorsWeek.has(k) ? 'Comido esta semana' : 'Aún no esta semana'}"><i style="--rb:${c.hex}"></i><span>${c.name.split(' ')[0]}</span></div>`).join('')}</div>
          <p class="muted small">${colorsWeek.size}/7 colores en los últimos 7 días. La variedad de color es variedad de nutrientes.</p>
          <div class="mini-stats"><span><b>${gags}</b> comidas con arcadas</span><span><b>${meals.filter((m) => m.choke).length}</b> atragantamientos</span><span><b>${reactions.length}</b> alimentos con reacción</span></div>`)}
      </div>
      ${W.card('Alérgenos', `<p class="muted small pad-b">Introduce cada alérgeno solo, por la mañana y de uno en uno. Tras 3 exposiciones sin reacción se considera introducido; después mantenlo 1–2 veces por semana.</p>
        <div class="allergens">${als.map((a) => `<div class="al al-${a.state}">

          ${UI.pill(AL_STATE[a.state].name, AL_STATE[a.state].tone)}
          <small>${a.last ? `última: ${U.relDay(U.dayKey(a.last))}` : a.foods.map((f) => f.name).slice(0, 2).join(', ')}</small></div>`).join('')}</div>`)}
      ${this.catalog(stats)}
      <div class="grid-2">
        ${W.card('Últimas comidas', meals.length ? W.timeline(meals.slice(-8).reverse().map((m) => ({ t: m.time, kind: 'meal', rec: m, col: 'meals' })), { date: true }) : UI.empty('leaf', 'Aún no hay comidas', 'Registra la primera comida para empezar el seguimiento.'))}
        ${this.safety()}
      </div>`;
    },
    catalog(stats) {
      const fl = UI.st.foodFilter, q = UI.st.foodQuery.toLowerCase();
      let foods = N.FOODS.filter((f) => {
        const s = stats[f.id];
        if (fl === 'tried' && !s) return false;
        if (fl === 'pending' && s) return false;
        if (fl === 'liked' && !(s && s.status === 'liked')) return false;
        if (fl === 'allergen' && !f.a) return false;
        if (fl === 'reaction' && !(s && s.status === 'reaction')) return false;
        return !q || f.name.toLowerCase().includes(q);
      });
      return W.card('Catálogo de alimentos', `<div class="cat-tools">${UI.seg('foodFilter', [['all', 'Todos'], ['tried', 'Probados'], ['liked', 'Le gustan'], ['pending', 'Por probar'], ['allergen', 'Alérgenos'], ['reaction', 'Con reacción']], fl)}
        <input type="search" id="food-search" class="food-q" placeholder="Buscar…" value="${U.esc(UI.st.foodQuery)}" aria-label="Buscar alimento"></div>
        <div class="foods" id="foods">${foods.map((f) => {
          const s = stats[f.id];
          return `<button type="button" class="food ${s ? 'is-' + s.status : 'is-new'}" data-act="food-detail" data-id="${f.id}">
            <span class="fe">${f.emoji}</span><b>${f.name}</b>
            <small>${s ? `${s.tries}× · ${STATUS[s.status].name}` : 'Por probar'}</small>
            ${f.a ? '<i class="dot-al" title="Alérgeno"></i>' : ''}${f.r ? '<i class="dot-risk" title="Preparar con cuidado"></i>' : ''}</button>`;
        }).join('') || '<p class="muted pad">Ningún alimento coincide.</p>'}</div>
        <p class="legend-line"><span><i class="dot-al"></i>Alérgeno</span><span><i class="dot-risk"></i>Riesgo de atragantamiento si no se prepara bien</span></p>`);
    },
    safety() {
      return W.card('Seguridad en la mesa', `<dl class="guide">
        <div><dt>Postura</dt><dd>Siempre sentado y erguido (90°), nunca recostado, en el coche o caminando. Un adulto delante todo el tiempo.</dd></div>
        <div><dt>Arcada o atragantamiento</dt><dd>La arcada es ruidosa (tose, se pone roja, saca la lengua): déjale resolver. El atragantamiento es silencioso y no puede toser: actúa con las maniobras de desobstrucción y llama al 112.</dd></div>
        <div><dt>Evitar antes del año</dt><dd>Miel, sal y azúcar añadidos, leche de vaca como bebida, frutos secos enteros, pez espada, atún rojo, tiburón y lucio, bebida de arroz, algas, y acelgas o espinacas en grandes cantidades.</dd></div>
        <div><dt>Formas de riesgo</dt><dd>Redondas y duras (uvas, cherrys, arándanos enteros) o crudas y duras (manzana, zanahoria). Corta a lo largo o cocina hasta que se aplasten entre tus dedos.</dd></div>
        <div><dt>La leche sigue siendo lo principal</dt><dd>Hasta el año, la comida es para descubrir; la leche aporta la mayor parte de la energía.</dd></div></dl>`);
    },
    mount(root) {
      const inp = root.querySelector('#food-search');
      if (inp) inp.addEventListener('input', () => {
        UI.st.foodQuery = inp.value;
        const q = inp.value.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
        root.querySelectorAll('#foods .food').forEach((el) => { el.hidden = q && !N.FOOD_BY_ID[el.dataset.id].name.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').includes(q); });
      });

  };
  N.actions['food-detail'] = (el) => {
    const f = N.FOOD_BY_ID[el.dataset.id]; const s = S.foodStats()[f.id];

      body: `<div class="food-detail">
        <div class="tags">${UI.pill(N.FOOD_CATS[f.c].name, 'soft')}${al ? UI.pill('Alérgeno: ' + al.name, 'warn') : ''}${f.r ? UI.pill('Preparar con cuidado', 'crit') : ''}${s ? UI.pill(STATUS[s.status].name, STATUS[s.status].tone) : UI.pill('Por probar', 'muted')}</div>
        <dl class="guide"><div><dt>De 6 a 9 meses</dt><dd>${f.s6}</dd></div><div><dt>Desde 9 meses (pinza)</dt><dd>${f.s9}</dd></div>${f.note ? `<div><dt>Ojo</dt><dd>${f.note}</dd></div>` : ''}</dl>
        ${s ? `<div class="kpis three">${W.kpi('Veces', s.tries)}${W.kpi('Primera vez', U.date(s.first))}${W.kpi('Cuánto come', N.EAT_AMOUNT[Math.round(s.amountAvg)])}</div>
          <h3 class="day-h">Historial</h3><ul class="rows">${hist.map((m) => { const x = m.foods.find((y) => y.id === f.id); return `<li><button type="button" class="row" data-act="edit" data-col="meals" data-id="${m.id}"><span>${U.date(m.time)} · ${(N.MEAL_TYPES.find((t) => t.id === m.mealType) || {}).name}</span><b>${['😖', '😐', '😋'][x.liked + 1]} ${N.EAT_AMOUNT[x.amount]}</b>${x.reaction !== 'none' ? UI.pill(N.REACTIONS[x.reaction].name, 'warn') : '<small></small>'}</button></li>`; }).join('')}</ul>` : ''}
        <button type="button" class="btn primary full" data-act="form-meal" data-food="${f.id}">${icon('plus')}Registrar comida con ${f.name.toLowerCase()}</button></div>`
    });
  };

  /* ======================= CRECIMIENTO ======================= */
  V.crecimiento = {
    render() {
      const b = S.baby(); const metric = UI.st.growthMetric; const M = N.METRICS[metric];
      const pts = S.measures().filter((m) => m[metric] != null).map((m) => ({ date: m.date, v: m[metric], age: S.measureAge(m), id: m.id }));
      const nowAge = S.ageMonths();
      const maxAge = Math.min(24, Math.max(6, Math.ceil(nowAge + 2)));
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const summary = ['weight', 'length', 'head'].map((k) => {
        const l = S.lastMeasure(k); if (!l) return W.kpi(N.METRICS[k].label, '–');
        const p = S.percentile(k, b.sex, S.measureAge(l), l[k]);
        return `<button type="button" class="kpi c-growth ${k === metric ? 'sel' : ''}" data-act="seg" data-seg="growthMetric" data-val="${k}"><span class="kpi-l">${N.METRICS[k].label}</span><b class="kpi-v">${U.num(l[k], N.METRICS[k].digits)} <small>${N.METRICS[k].unit}</small></b><span class="kpi-s">Percentil ${Math.round(p)} · ${U.date(l.date)}</span></button>`;
      }).join('');
      let trend = '';
      if (last && prev) {
        const days = (U.parseDay(last.date) - U.parseDay(prev.date)) / U.DAY;
        const diff = last.v - prev.v;
        trend = metric === 'weight' ? `+${Math.round((diff * 1000) / Math.max(1, days))} g/día desde el ${U.date(prev.date)} (${U.num(diff * 1000, 0)} g en ${Math.round(days)} días)` : `${diff >= 0 ? '+' : ''}${U.num(diff, 1)} cm desde el ${U.date(prev.date)}`;
      }
      const rows = S.measures().slice().reverse();
      return UI.head('Crecimiento', `Curvas de la OMS para ${b.sex === 'm' ? 'niños' : 'niñas'} de 0 a 2 años`, `<button type="button" class="btn primary" data-act="form-measure">${icon('plus')}Nueva medida</button>`) + `
      <div class="kpis three">${summary}</div>
      ${W.card(`${M.label} (${M.unit})`, `<div class="chart-top">${UI.seg('growthMetric', [['weight', 'Peso'], ['length', 'Longitud'], ['head', 'P. craneal']], metric)}
        <ul class="legend"><li><i class="lg-dot"></i>${U.esc(b.name)}</li><li><i class="lg-p50"></i>Mediana (P50)</li><li><i class="lg-pin"></i>P15–P85</li><li><i class="lg-pout"></i>P3–P97</li></ul></div>
        ${trend ? `<p class="trend">${icon('spark')} ${trend}</p>` : ''}
        ${Charts.growth(metric, b.sex, pts, { maxAge, now: nowAge })}
        <p class="muted small">Lo importante no es el percentil concreto sino que siga su propia curva. Consulta si cruza dos líneas de percentil hacia arriba o hacia abajo.</p>`)}
      ${W.card('Todas las medidas', `<div class="scroll-x"><table class="tbl"><thead><tr><th>Fecha</th><th>Edad</th><th class="num">Peso</th><th class="num">Longitud</th><th class="num">P. craneal</th><th>Nota</th></tr></thead><tbody>
        ${rows.map((m) => { const age = S.measureAge(m); const cell = (k) => m[k] != null ? `${U.num(m[k], N.METRICS[k].digits)} <small>P${Math.round(S.percentile(k, b.sex, age, m[k]))}</small>` : '–';
          return `<tr data-act="form-measure" data-id="${m.id}" tabindex="0"><td>${U.date(m.date, true)}</td><td>${U.ageShort(b.birth, U.parseDay(m.date))}</td><td class="num">${cell('weight')}</td><td class="num">${cell('length')}</td><td class="num">${cell('head')}</td><td class="note-cell">${U.esc(m.note || '')}</td></tr>`; }).join('')}

    },
    apptCard(a) {
      const T = N.APPT_TYPES[a.type] || N.APPT_TYPES.otro;
      const d = new Date(U.parseDay(a.date));
      return `<article class="appt ${a.done ? 'done' : ''}" style="--tc:${T.color}">
        <div class="appt-date"><b>${d.getDate()}</b><span>${U.MONTHS[d.getMonth()]}</span></div>
        <div class="appt-body">
          <header><h3>${U.esc(a.title)}</h3><button type="button" class="icon-btn sm" data-act="form-appt" data-id="${a.id}" aria-label="Editar cita">${icon('edit')}</button></header>
          <p class="muted small">${UI.pill(T.name, 'soft')} ${U.relDay(a.date)}${a.time ? ' · ' + a.time : ''}${a.place ? ' · ' + U.esc(a.place) : ''}${a.doctor ? ' · ' + U.esc(a.doctor) : ''}</p>
          ${(a.questions || []).length ? `<ul class="qs">${a.questions.map((q, i) => `<li><label><input type="checkbox" ${q.done ? 'checked' : ''} data-act="q-toggle" data-id="${a.id}" data-i="${i}"><span>${U.esc(q.text)}</span></label></li>`).join('')}</ul>` : ''}

    citas() {

      const scheduled = nextCheck && S.appointments().some((a) => a.title.toLowerCase().includes(nextCheck.name.toLowerCase().replace('revisión ', '')));

    },
    vacunas() {
      const plan = S.vaccinePlan();
      const groups = {}; plan.forEach((v) => { (groups[v.m] = groups[v.m] || []).push(v); });

      const st = { done: ['Puesta', 'good'], late: ['Pendiente', 'crit'], due: ['Le corresponde', 'warn'], soon: ['Próxima', 'soft'], future: ['Prevista', 'muted'] };

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1519" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Nido: registro completo del bebé. Sueño, tomas, BLW, crecimiento con curvas OMS, citas, vacunas, hitos y diario.">
  <title>Nido</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nido">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/nido.css">
</head>
<body>
  <div class="app">
    <aside id="sidenav" class="sidenav" aria-label="Secciones"></aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Secciones principales"></nav>
  <button type="button" class="fab" data-act="quick-add" aria-label="Registrar">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div id="player" class="player c-sleep" role="status" aria-live="polite" hidden></div>
  <div id="sheet" class="sheet-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/media.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/views-daily.js"></script>
  <script src="js/views-care.js"></script>
  <script src="js/views-more.js"></script>
  <script src="js/blwplan.js"></script>
  <script src="js/activities.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going Merry 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Pirata+One&display=swap">
<style>
/* Layout: escenario 3D a sangre completa + un único panel de bitácora flotante (izquierda en escritorio, hoja inferior en móvil) */
:root {
  --sea: #0c1d2e;
  --panel: rgba(11, 24, 38, 0.9);
  --panel-solid: #0f2236;
  --fg: #eef3f6;
  --muted: #a3b6c6;
  --line: rgba(214, 230, 240, 0.14);
  --straw: #f2b632;
  --straw-ink: #1d1604;
  --band: #cf3a2e;
  --display: "Pirata One", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--sea);
  color: var(--fg);
  font: 14px/1.5 var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 8px;
  font: 600 12px/1 var(--body);
  color: var(--fg);
  background: rgba(11, 24, 38, 0.82);
  border: 1px solid var(--line);
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto;
  transition: background .15s, color .15s;
}
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--straw); flex: none; }
.tag:hover { background: var(--panel-solid); }
.tag.active { background: var(--straw); color: var(--straw-ink); border-color: transparent; }
.tag.active::before { background: var(--band); }

.panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 16px;
  width: 310px;
  max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  margin: 0;
  font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 2px 0 0;
  font: 400 40px/1 var(--display);
  color: var(--straw);
  text-wrap: balance;
}
.icon-btn {
  flex: none;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: transparent; color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px;
  font: 600 16px/1 var(--body);
  cursor: pointer;
}
.panel-body {
  display: flex; flex-direction: column; gap: 18px;
  padding: 14px 16px 16px;
  overflow-y: auto;
  min-height: 0;
}
h2 {
  margin: 0 0 8px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 3px; gap: 3px;
  background: rgba(255, 255, 255, .06);
  border-radius: 10px;
}
.seg button {
  padding: 8px 4px;
  font: 600 13px/1.1 var(--body);
  color: var(--muted);
  background: transparent;
  border: 0; border-radius: 8px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--straw); color: var(--straw-ink); }
.range { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.range[hidden] { display: none !important; }
.range input { width: 100%; accent-color: var(--straw); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 12px; }
.toggles label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggles input { accent-color: var(--straw); width: 16px; height: 16px; margin: 0; }

.group + .group { margin-top: 10px; }
.group h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.rooms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rooms button {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px;
  font: 500 14px/1.2 var(--body);
  color: var(--fg); text-align: left;
  background: transparent;
  border: 0; border-radius: 8px;
  cursor: pointer;
}
.rooms button:hover { background: rgba(255, 255, 255, .06); }
.rooms button.active { background: rgba(242, 182, 50, .16); color: var(--straw); }
.chip {
  flex: none;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 6px;
}
.info {
  padding: 12px;
  background: rgba(255, 255, 255, .05);
  border-radius: 10px;
}
.info h3 { margin: 0 0 4px; font: 400 24px/1.1 var(--display); color: var(--fg); }
.info p { margin: 0; color: var(--muted); max-width: 65ch; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

button:focus-visible, input:focus-visible, .tag:focus-visible {
  outline: 2px solid var(--straw); outline-offset: 2px;
}

@media (max-width: 720px) {
  .panel {
    top: auto; right: 16px; width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    max-height: 50%;
  }
  h1 { font-size: 32px; }
  .tag { font-size: 11px; padding: 4px 8px 4px 6px; }
}
</style>
</head>
<body>

<div id="stage" aria-label="Modelo 3D del Going Merry"></div>
<div id="labels"></div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div>
      <p class="eyebrow">Carabela de los Sombrero de Paja</p>
      <h1>Going Merry</h1>
    </div>
    <button class="icon-btn" id="collapse" aria-expanded="true" aria-controls="panelBody" aria-label="Plegar panel">–</button>
  </div>
  <div class="panel-body" id="panelBody">
    <section>
      <h2>Vista</h2>
      <div class="seg" role="group" aria-label="Modo de vista">
        <button type="button" id="mExt" data-mode="ext" aria-pressed="true">Exterior</button>
        <button type="button" id="mCut" data-mode="cut" aria-pressed="false">Corte</button>
        <button type="button" id="mXray" data-mode="xray" aria-pressed="false">Rayos X</button>
      </div>
      <label class="range" id="cutRow" hidden>
        Profundidad del corte
        <input type="range" id="cut" min="0" max="100" value="90">
      </label>
      <div class="toggles">
        <label><input type="checkbox" id="tRoof" checked> Cubierta</label>
        <label><input type="checkbox" id="tSea" checked> Mar</label>
        <label><input type="checkbox" id="tLabels" checked> Etiquetas</label>
        <label><input type="checkbox" id="tSpin" checked> Girar solo</label>
      </div>
    </section>

    <section>
      <h2>Recorrido</h2>
      <div class="group">
        <h3>En cubierta</h3>
        <ul class="rooms" id="roomsTop"></ul>
      </div>
      <div class="group">
        <h3>Bajo cubierta</h3>
        <ul class="rooms" id="roomsBelow"></ul>
      </div>
    </section>

    <section class="info" id="info" aria-live="polite">
      <h3 id="infoTitle">Going Merry</h3>
      <p id="infoText"></p>
    </section>

    <p class="hint">Arrastra para girar · rueda o pellizco para acercar · clic derecho o dos dedos para desplazar.</p>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Generador pseudoaleatorio con semilla: el barco sale igual en cada carga
  let seed = 7;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  /* ---------- Escena ---------- */
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = (() => {
    const c = document.createElement("canvas"); c.width = 4; c.height = 256;
    const g = c.getContext("2d");
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, "#4f8fc4"); grad.addColorStop(0.6, "#a9d0e8"); grad.addColorStop(1, "#d8ecf5");
    g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
    return new THREE.CanvasTexture(c);
  })();
  scene.fog = new THREE.Fog(0xcfe6f2, 70, 190);

  const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 600);
  camera.position.set(24, 10, 22);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 80;
  controls.maxPolarAngle = Math.PI * 0.95;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.6;

  scene.add(new THREE.HemisphereLight(0xe4f2ff, 0x5a4630, 0.7));
  const sun = new THREE.DirectionalLight(0xfff0d4, 0.95);
  sun.position.set(18, 32, 14);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  /* ---------- Materiales y texturas ---------- */
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1000);
  const shellMats = [];
  function shell(params) {
    const m = new THREE.MeshStandardMaterial(Object.assign({
      side: THREE.DoubleSide, clippingPlanes: [cutPlane], clipShadows: true, roughness: 0.82
    }, params));
    shellMats.push(m);
    return m;
  }
  const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75 }, extra));

  function plankTex(base, line, rows, cols) {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = base; g.fillRect(0, 0, 512, 512);
    const rh = 512 / rows;
    for (let r = 0; r < rows; r++) {
      g.fillStyle = rand() < 0.5 ? `rgba(255,255,255,${rand() * 0.08})` : `rgba(0,0,0,${rand() * 0.08})`;
      g.fillRect(0, r * rh, 512, rh);
      g.strokeStyle = "rgba(0,0,0,0.05)"; g.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        const y = r * rh + rand() * rh;
        g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(170, y + rand() * 4 - 2, 340, y + rand() * 4 - 2, 512, y); g.stroke();
      }
      g.fillStyle = line;
      g.fillRect(0, r * rh, 512, 2);
      const off = (r % 3) * 512 / cols / 3;
      for (let k = 0; k < cols; k++) g.fillRect((off + k * 512 / cols) % 512, r * rh, 2, rh);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  function jollyTex(fg, bg, w, h) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * 0.56, s = Math.min(w, h) * 0.26;
    // Tibias cruzadas
    g.strokeStyle = fg; g.fillStyle = fg; g.lineCap = "round"; g.lineWidth = s * 0.22;
    for (const d of [1, -1]) {
      const ax = cx - s * 1.25, ay = cy + d * s * 1.0, bx = cx + s * 1.25, by = cy - d * s * 1.0;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      for (const [ex, ey] of [[ax, ay], [bx, by]]) {
        g.beginPath(); g.arc(ex - s * 0.08, ey - s * 0.12, s * 0.16, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(ex + s * 0.08, ey + s * 0.12, s * 0.16, 0, Math.PI * 2); g.fill();
      }
    }
    // Calavera
    g.beginPath(); g.arc(cx, cy - s * 0.1, s * 0.74, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.roundRect ? g.roundRect(cx - s * 0.44, cy + s * 0.3, s * 0.88, s * 0.52, s * 0.12) : g.rect(cx - s * 0.44, cy + s * 0.3, s * 0.88, s * 0.52); g.fill();
    g.fillStyle = bg;
    for (const e of [-1, 1]) { g.beginPath(); g.ellipse(cx + e * s * 0.28, cy + s * 0.02, s * 0.2, s * 0.24, 0, 0, Math.PI * 2); g.fill(); }
    g.beginPath(); g.moveTo(cx, cy + s * 0.22); g.lineTo(cx - s * 0.09, cy + s * 0.38); g.lineTo(cx + s * 0.09, cy + s * 0.38); g.fill();
    g.fillRect(cx - s * 0.36, cy + s * 0.56, s * 0.72, s * 0.05);
    for (let k = -2; k <= 2; k++) g.fillRect(cx + k * s * 0.15 - s * 0.02, cy + s * 0.46, s * 0.04, s * 0.3);
    // Sombrero de paja
    g.fillStyle = "#e9b52b";
    g.beginPath(); g.ellipse(cx, cy - s * 0.52, s * 1.08, s * 0.2, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(cx, cy - s * 0.6, s * 0.6, s * 0.52, 0, Math.PI, Math.PI * 2); g.fill();
    g.fillStyle = "#c8322a";
    g.fillRect(cx - s * 0.6, cy - s * 0.78, s * 1.2, s * 0.17);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  function mapTex() {
    const c = document.createElement("canvas"); c.width = 256; c.height = 192;
    const g = c.getContext("2d");
    g.fillStyle = "#e9d7a8"; g.fillRect(0, 0, 256, 192);
    g.strokeStyle = "#3b5f7a"; g.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      g.beginPath();
      let x = 30 + rand() * 190, y = 30 + rand() * 130;
      g.moveTo(x, y);
      for (let i = 0; i < 9; i++) { x += rand() * 40 - 20; y += rand() * 40 - 20; g.lineTo(x, y); }
      g.closePath(); g.stroke();
    }
    g.strokeStyle = "#b0413a"; g.setLineDash([5, 5]);
    g.beginPath(); g.moveTo(20, 170); g.bezierCurveTo(90, 120, 150, 150, 236, 30); g.stroke();
    return new THREE.CanvasTexture(c);
  }

  const hullTex = plankTex("#dcb57d", "#7d5a2e", 16, 3);
  const deckTex = plankTex("#c89b5f", "#6f4c26", 8, 2);
  const floorTex = plankTex("#a8794a", "#5c3d1d", 8, 2);
  const wallTex = plankTex("#e3c794", "#8a6534", 6, 1);
  wallTex.repeat.set(0.35, 0.35);

  const hullMat = shell({ map: hullTex });
  const deckMat = shell({ map: deckTex });
  const wallMat = shell({ map: wallTex });
  const trimMat = shell({ color: 0x5b3a1e });
  const floorMat = mat(0xffffff, { map: floorTex, side: THREE.DoubleSide });
  const darkWood = mat(0x5e3d20);
  const midWood = mat(0x8c5f33);
  const lightWood = mat(0xc49a62);
  const iron = mat(0x2a2c30, { metalness: 0.6, roughness: 0.45 });
  const cloth = mat(0xece4d2, { side: THREE.DoubleSide, roughness: 0.95 });
  const rope = new THREE.LineBasicMaterial({ color: 0x3a2a1a });

  /* ---------- Forma del casco ---------- */
  const X0 = -9, X1 = 10.4, W = 3.5, SIDE_EXP = 0.6;
  const top = x => 0.8 + 0.7 * (x / 10) * (x / 10);
  const half = x => {
    if (x >= 0) { const t = Math.min(x / X1, 1); return W * Math.pow(Math.max(1 - Math.pow(t, 2.2), 0), 0.55); }
    const t = x / X0; return W * (1 - 0.32 * t * t * t);
  };
  const bottom = x => {
    if (x >= 0) { const t = Math.min(x / X1, 1); return -3.2 * Math.sqrt(Math.max(1 - t * t * t, 0)); }
    const t = x / X0; return -3.2 + 0.9 * t * t;
  };
  // Semiancho del casco a una altura dada (inversa exacta de la sección)
  const halfAt = (x, y) => {
    const T = top(x), B = bottom(x);
    if (y > T || y < B || T - B < 1e-4) return 0;
    const s = Math.min(Math.pow((T - y) / (T - B), 1 / SIDE_EXP), 1);
    return half(x) * Math.sqrt(1 - s * s);
  };

  const ship = new THREE.Group();
  scene.add(ship);
  const topside = new THREE.Group(); // lo que se retira con "Cubierta"
  ship.add(topside);

  function addMesh(geo, m, parent = ship, cast = true) {
    const o = new THREE.Mesh(geo, m);
    o.castShadow = cast; o.receiveShadow = true;
    parent.add(o);
    return o;
  }
  function box(w, h, d, m, x, y, z, parent = ship) {
    const o = addMesh(new THREE.BoxGeometry(w, h, d), m, parent);
    o.position.set(x, y, z);
    return o;
  }
  function cyl(rt, rb, h, m, x, y, z, parent = ship, seg = 18) {
    const o = addMesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, parent);
    o.position.set(x, y, z);
    return o;
  }
  function sphere(r, m, x, y, z, parent = ship, seg = 16) {
    const o = addMesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg * 0.75 | 0)), m, parent);
    o.position.set(x, y, z);
    return o;
  }

  // Casco
  (() => {
    const N = 80, M = 30, pos = [], uv = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = X0 + (X1 - X0) * (0.5 - 0.5 * Math.cos(Math.PI * t));
      const T = top(x), B = bottom(x), w = half(x);
      for (let j = 0; j <= M; j++) {
        const th = Math.PI * j / M, s = Math.sin(th);
        pos.push(x, T - (T - B) * Math.pow(s, SIDE_EXP), -w * Math.cos(th));
        uv.push((x - X0) / 4, j / M * 2.5);
      }
    }
    for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
      const a = i * (M + 1) + j, b = a + M + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    addMesh(g, hullMat);

    // Espejo de popa
    const tp = [X0, (top(X0) + bottom(X0)) / 2, 0], tuv = [0.5, 0.5], tidx = [];
    for (let j = 0; j <= M; j++) {
      const th = Math.PI * j / M, T = top(X0), B = bottom(X0);
      tp.push(X0, T - (T - B) * Math.pow(Math.sin(th), SIDE_EXP), -half(X0) * Math.cos(th));
      tuv.push(j / M, Math.sin(th));
    }
    for (let j = 1; j <= M; j++) tidx.push(0, j, j + 1);
    tidx.push(0, M + 1, 1);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3));
    tg.setAttribute("uv", new THREE.Float32BufferAttribute(tuv, 2));
    tg.setIndex(tidx); tg.computeVertexNormals();
    addMesh(tg, hullMat);
  })();

  // Regala y cintones
  function tubeAlong(fn, x0, x1, r, m, parent = ship) {
    const pts = [];
    for (let k = 0; k <= 30; k++) { const x = x0 + (x1 - x0) * k / 30; pts.push(fn(x)); }
    return addMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, r, 6), m, parent);
  }
  for (const side of [-1, 1]) {
    tubeAlong(x => new THREE.Vector3(x, top(x) + 0.05, side * (half(x) + 0.03)), X0, X1 - 0.05, 0.09, trimMat);
    tubeAlong(x => { const y = top(x) - 0.45; return new THREE.Vector3(x, y, side * (halfAt(x, y) + 0.04)); }, X0 + 0.02, X1 - 0.35, 0.07, trimMat);
    tubeAlong(x => { const y = top(x) - 1.35; return new THREE.Vector3(x, y, side * (halfAt(x, y) + 0.04)); }, X0 + 0.02, X1 - 0.9, 0.06, trimMat);
  }
  box(0.14, 0.12, half(X0) * 2 + 0.1, trimMat, X0, top(X0) + 0.05, 0);

  // Cubiertas (tira siguiendo el ancho del casco a esa altura)
  function strip(y, xa, xb, m, parent, uvScale) {

    const m = new THREE.MeshStandardMaterial({ color: 0x1d6f9c, roughness: 0.3, metalness: 0.15, flatShading: true, transparent: true, opacity: 0.93 });
    const o = new THREE.Mesh(g, m);
    o.position.y = -1.5;
    o.receiveShadow = true;
    o.userData.base = g.attributes.position.array.slice();
    scene.add(o);
    return o;
  })();

  /* ---------- Estancias y recorrido ---------- */
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const rooms = [
    { id: "overview", name: "Vista general", group: "top", mode: "ext", anchor: null,
      cam: [V(24, 10, 22), V(0, 3, 0)],
      text: "Carabela regalada a Luffy por Kaya en el pueblo de Syrup. La diseñó y construyó Merry, su mayordomo. Llevó a la tripulación desde el East Blue hasta Water 7." },
    { id: "figurehead", name: "Mascarón de carnero", group: "top", mode: "ext", anchor: V(11.1, 2.8, 0),
      cam: [V(17, 4, 6), V(11, 1.8, 0)],
      text: "La cabeza de carnero con cuernos en espiral. Es el asiento favorito de Luffy para mirar al horizonte." },
    { id: "sail", name: "Vela mayor", group: "top", mode: "ext", anchor: V(2.4, 6.4, 0),
      cam: [V(18, 7, 3), V(1, 6.3, 0)],
      text: "Vela cuadra con la Jolly Roger del sombrero de paja. Luffy la dibujó primero y Usopp la repintó para que se entendiera." },
    { id: "nest", name: "Cofa", group: "top", mode: "ext", anchor: V(MAST_X, 11.4, 0),
      cam: [V(7, 13.5, 6), V(MAST_X, 10.5, 0)],
      text: "Puesto de vigía en lo alto del mástil. Desde aquí se avistan islas, barcos de la Marina y tormentas." },
    { id: "mikan", name: "Mandarinos de Nami", group: "top", mode: "ext", anchor: V(-6.6, 4.4, 0),
      cam: [V(-1, 7.5, 7), V(-6.6, 2.8, 0)],
      text: "Los árboles de Bell-mère, traídos desde Cocoyashi. Crecen en la toldilla, sobre la cocina, y nadie toca una mandarina sin permiso." },
    { id: "galley", name: "Cocina y comedor", group: "top", mode: "cut", anchor: V(-6.4, 1.6, 0.3),
      cam: [V(-6.4, 1.8, 8), V(-6.4, 1.0, 0)],
      text: "El dominio de Sanji: fogón, encimera y la mesa donde come toda la tripulación, bajo la toldilla." },
    { id: "women", name: "Camarote de las chicas", group: "below", mode: "cut", anchor: V(-6.3, -0.8, 0),
      cam: [V(-6.3, -0.6, 8), V(-6.3, -1.3, 0)],
      text: "Habitación de Nami (y más tarde de Robin), bajo la cocina. Aquí Nami dibuja sus cartas de navegación." },
    { id: "men", name: "Dormitorio de los chicos", group: "below", mode: "cut", anchor: V(-0.6, -0.8, 0),
      cam: [V(-0.4, -0.5, 10), V(-0.4, -1.3, 0)],
      text: "Hamacas colgadas, un sofá y una mesa. Se baja por la escala del escotillón de la cubierta principal." },
    { id: "hold", name: "Bodega", group: "below", mode: "cut", anchor: V(5.8, -0.8, 0),
      cam: [V(5.8, -0.5, 8.5), V(5.8, -1.3, 0)],
      text: "Provisiones, barriles de agua, cabos de repuesto y balas de cañón, en el tramo de proa bajo cubierta." }
  ];

  /* ---------- UI ---------- */
  const $ = id => document.getElementById(id);
  const labelsEl = $("labels");
  const tags = new Map();
  const listBtns = new Map();

  rooms.forEach(r => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span>${r.name}</span>` + (r.mode === "cut" ? `<span class="chip">Interior</span>` : "");
    b.addEventListener("click", () => select(r.id, true));
    li.appendChild(b);
    $(r.group === "top" ? "roomsTop" : "roomsBelow").appendChild(li);
    listBtns.set(r.id, b);
    if (r.anchor) {
      const t = document.createElement("button");
      t.type = "button"; t.className = "tag"; t.textContent = r.name;
      t.addEventListener("click", () => select(r.id, true));
      labelsEl.appendChild(t);
      tags.set(r.id, t);
    }
  });

  let mode = "ext";
  const cutInput = $("cut");
  const cutZ = () => 3.8 - (cutInput.value / 100) * 4.0;

  function setMode(m) {
    mode = m;
    ["mExt", "mCut", "mXray"].forEach(id => { const b = $(id); b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
    $("cutRow").hidden = m !== "cut";
    cutPlane.constant = m === "cut" ? cutZ() : 1000;
    const xr = m === "xray";
    shellMats.forEach(sm => { sm.transparent = xr; sm.opacity = xr ? 0.16 : 1; sm.depthWrite = !xr; sm.needsUpdate = true; });
    syncSea();
  }
  // Las lámparas interiores se apagan con el mar visible: si no, iluminan el agua bajo el casco
  function syncSea() {
    water.visible = mode === "ext" && $("tSea").checked;
    lamps.forEach(l => { l.visible = !water.visible; });
  }

  let flight = null;
  function flyTo([pos, target]) {
    if (reduceMotion) { camera.position.copy(pos); controls.target.copy(target); return; }
    flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), dur: 1300 };
  }

  function select(id, fly) {
    const r = rooms.find(q => q.id === id);
    listBtns.forEach((b, k) => b.classList.toggle("active", k === id));
    tags.forEach((t, k) => t.classList.toggle("active", k === id));
    $("infoTitle").textContent = r.name;
    $("infoText").textContent = r.text;
    if (r.mode === "cut") { if (mode !== "cut") { cutInput.value = 90; setMode("cut"); } }
    else if (mode === "cut") setMode("ext");
    if (fly) {
      controls.autoRotate = false; $("tSpin").checked = false;
      flyTo(r.cam);
    }
  }

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  cutInput.addEventListener("input", () => { if (mode === "cut") cutPlane.constant = cutZ(); });
  $("tRoof").addEventListener("change", e => { topside.visible = e.target.checked; });
  $("tSea").addEventListener("change", syncSea);
  $("tLabels").addEventListener("change", e => { labelsEl.hidden = !e.target.checked; });
  $("tSpin").addEventListener("change", e => { controls.autoRotate = e.target.checked; });
  $("tSpin").checked = controls.autoRotate;
  controls.addEventListener("start", () => { flight = null; if (controls.autoRotate) { controls.autoRotate = false; $("tSpin").checked = false; } });

  $("collapse").addEventListener("click", () => {
    const body = $("panelBody");
    body.hidden = !body.hidden;
    $("collapse").textContent = body.hidden ? "+" : "–";
    $("collapse").setAttribute("aria-expanded", String(!body.hidden));
    $("collapse").setAttribute("aria-label", body.hidden ? "Desplegar panel" : "Plegar panel");
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  syncSea();
  select("overview", false);

  /* ---------- Bucle ---------- */
  const tmp = new THREE.Vector3();
  const clock = new THREE.Clock();
  function tick() {
    const t = clock.getElapsedTime();

    if (flight) {
      const k = Math.min(1, (performance.now() - flight.start) / flight.dur);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.t0, flight.t1, e);
      if (k >= 1) flight = null;
    }
    controls.update();

    const bob = mode === "ext" && !reduceMotion;
    const targetRz = bob ? Math.sin(t * 0.6) * 0.018 : 0;
    const targetRx = bob ? Math.sin(t * 0.8) * 0.025 : 0;
    const targetY = bob ? Math.sin(t * 0.9) * 0.08 : 0;
    ship.rotation.z += (targetRz - ship.rotation.z) * 0.1;
    ship.rotation.x += (targetRx - ship.rotation.x) * 0.1;
    ship.position.y += (targetY - ship.position.y) * 0.1;

    if (water.visible) {
      const p = water.geometry.attributes.position, base = water.userData.base;
      for (let i = 0; i < p.count; i++) {
        const x = base[i * 3], z = base[i * 3 + 2];
        p.array[i * 3 + 1] = Math.sin(x * 0.15 + t * 1.1) * 0.22 + Math.cos(z * 0.2 + t * 0.8) * 0.18;
      }
      p.needsUpdate = true;
    }

    {
      const p = flag.geometry.attributes.position, base = flag.userData.base;
      for (let i = 0; i < p.count; i++) {
        const u = base[i * 3];
        p.array[i * 3 + 2] = Math.sin(u * 3.2 - t * 5) * 0.14 * u;
      }
      p.needsUpdate = true;
    }

    renderer.render(scene, camera);

    if (!labelsEl.hidden) {
      const w = stage.clientWidth, h = stage.clientHeight;
      rooms.forEach(r => {
        const tag = tags.get(r.id);
        if (!tag) return;
        tmp.copy(r.anchor);
        ship.localToWorld(tmp);
        tmp.project(camera);
        const visible = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
        tag.style.display = visible ? "" : "none";
        if (visible) tag.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`;
      });
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going Merry 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Pirata+One&display=swap">
<style>
/* Layout: escenario 3D a sangre completa + un único panel de bitácora flotante (izquierda en escritorio, hoja inferior en móvil) */
:root {
  --sea: #0c1d2e;
  --panel: rgba(11, 24, 38, 0.9);
  --panel-solid: #0f2236;
  --fg: #eef3f6;
  --muted: #a3b6c6;
  --line: rgba(214, 230, 240, 0.14);
  --straw: #f2b632;
  --straw-ink: #1d1604;
  --band: #cf3a2e;
  --display: "Pirata One", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--sea);
  color: var(--fg);
  font: 14px/1.5 var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 8px;
  font: 600 12px/1 var(--body);
  color: var(--fg);
  background: rgba(11, 24, 38, 0.82);
  border: 1px solid var(--line);
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto;
  transition: background .15s, color .15s;
}
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--straw); flex: none; }
.tag:hover { background: var(--panel-solid); }
.tag.active { background: var(--straw); color: var(--straw-ink); border-color: transparent; }
.tag.active::before { background: var(--band); }
.tag.crew {
  font: 500 11px/1 var(--body);
  padding: 4px 8px;
  background: rgba(255, 255, 255, .9);
  color: #13202c;
  border-color: transparent;
}
.tag.crew::before { display: none; }

.panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 16px;
  width: 320px;
  max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  margin: 0;
  font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 2px 0 0;
  font: 400 40px/1 var(--display);
  color: var(--straw);
  text-wrap: balance;
}
.icon-btn {
  flex: none;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: transparent; color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px;
  font: 600 16px/1 var(--body);
  cursor: pointer;
}
.panel-body {
  display: flex; flex-direction: column; gap: 18px;
  padding: 14px 16px 16px;
  overflow-y: auto;
  min-height: 0;
}
h2 {
  margin: 0 0 8px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.seg {
  display: grid; grid-template-columns: repeat(var(--n, 3), 1fr);
  padding: 3px; gap: 3px;
  background: rgba(255, 255, 255, .06);
  border-radius: 10px;
}
.seg + .seg { margin-top: 8px; }
.seg button {
  padding: 8px 2px;
  font: 600 12.5px/1.1 var(--body);
  color: var(--muted);
  background: transparent;
  border: 0; border-radius: 8px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--straw); color: var(--straw-ink); }
.range { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.range input { width: 100%; accent-color: var(--straw); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 12px; }
.toggles label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggles input { accent-color: var(--straw); width: 16px; height: 16px; margin: 0; }

.group + .group { margin-top: 10px; }
.group h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.rooms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rooms button {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px;
  font: 500 14px/1.2 var(--body);
  color: var(--fg); text-align: left;
  background: transparent;
  border: 0; border-radius: 8px;
  cursor: pointer;
}
.rooms button:hover { background: rgba(255, 255, 255, .06); }
.rooms button.active { background: rgba(242, 182, 50, .16); color: var(--straw); }
.chip {
  flex: none;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 6px;
}
.info {
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px;
  background: rgba(255, 255, 255, .05);
  border-radius: 10px;
}
.info h3 { margin: 0; font: 400 24px/1.1 var(--display); color: var(--fg); }
.info p { margin: 0; color: var(--muted); max-width: 65ch; }
.info .who { color: var(--fg); font-size: 13px; }
.info .who b { color: var(--straw); font-weight: 600; }
.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.items li { display: flex; gap: 8px; }
.items li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--straw); }
.spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; }
.enter {
  align-self: flex-start;
  padding: 8px 14px;
  font: 600 13px/1 var(--body);
  color: var(--straw-ink);
  background: var(--straw);
  border: 0; border-radius: 8px;
  cursor: pointer;
}
.hint { margin: 0; font-size: 12px; color: var(--muted); }

.inside-bar {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px);
  padding: 8px 8px 8px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 13px;
}
.inside-bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inside-bar b { color: var(--straw); font-weight: 600; }
.inside-bar button {
  flex: none;
  padding: 7px 12px;
  font: 600 13px/1 var(--body);
  color: var(--straw-ink); background: var(--straw);
  border: 0; border-radius: 999px; cursor: pointer;
}

button:focus-visible, input:focus-visible, .tag:focus-visible {
  outline: 2px solid var(--straw); outline-offset: 2px;
}

@media (min-width: 721px) {
  .inside-bar { left: calc(50% + 168px); }
}
@media (max-width: 720px) {
  .panel {
    top: auto; right: 16px; width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    max-height: 50%;
  }
  h1 { font-size: 32px; }
  .tag { font-size: 11px; padding: 4px 8px 4px 6px; }
  .inside-bar .long { display: none; }
}
</style>
</head>
<body>

<div id="stage" aria-label="Modelo 3D del Going Merry"></div>
<div id="labels"></div>

<div class="inside-bar" id="insideBar" hidden>
  <span>Dentro de <b id="insideName"></b><span class="long"> · arrastra para mirar alrededor</span></span>
  <button type="button" id="exitInside">Salir</button>
</div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div>
      <p class="eyebrow">Carabela de los Sombrero de Paja</p>
      <h1>Going Merry</h1>
    </div>
    <button class="icon-btn" id="collapse" aria-expanded="true" aria-controls="panelBody" aria-label="Plegar panel">–</button>
  </div>
  <div class="panel-body" id="panelBody">
    <section>
      <h2>Vista</h2>
      <div class="seg" style="--n:4" role="group" aria-label="Modo de vista" id="modeSeg">
        <button type="button" data-mode="ext" aria-pressed="true">Exterior</button>
        <button type="button" data-mode="cut" aria-pressed="false">Corte</button>
        <button type="button" data-mode="xray" aria-pressed="false">Rayos X</button>
        <button type="button" data-mode="explode" aria-pressed="false">Despiece</button>
      </div>
      <div class="seg" style="--n:3" role="group" aria-label="Hora del día" id="timeSeg">
        <button type="button" data-time="day" aria-pressed="true">Día</button>
        <button type="button" data-time="dusk" aria-pressed="false">Atardecer</button>
        <button type="button" data-time="night" aria-pressed="false">Noche</button>
      </div>
      <label class="range" id="cutRow" hidden>
        Profundidad del corte
        <input type="range" id="cut" min="0" max="100" value="90">
      </label>
      <div class="toggles">
        <label><input type="checkbox" id="tSea" checked> Mar</label>
        <label><input type="checkbox" id="tLabels" checked> Etiquetas</label>
        <label><input type="checkbox" id="tCrew" checked> Tripulación</label>
        <label><input type="checkbox" id="tSpin" checked> Girar solo</label>
      </div>
    </section>

    <section>
      <h2>Recorrido</h2>
      <div class="group">
        <h3>Sobre cubierta</h3>
        <ul class="rooms" id="roomsTop"></ul>
      </div>
      <div class="group">
        <h3>Bajo cubierta</h3>
        <ul class="rooms" id="roomsBelow"></ul>
      </div>
    </section>

    <section class="info" id="info" aria-live="polite"></section>

    <p class="hint">Arrastra para girar · rueda o pellizco para acercar · clic derecho o dos dedos para desplazar · pulsa el barco para elegir una estancia.</p>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  THREE.ColorManagement.legacyMode = false;

  // Generador pseudoaleatorio con semilla: el barco sale igual en cada carga
  let seed = 7;
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  /* =========================================================
     Escena, cámara y render
     ========================================================= */
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcfe6f2, 90, 430);

  const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 1200);
  camera.position.set(26, 11, 24);
  if (stage.clientWidth < 720) camera.position.set(40, 16, 38).multiplyScalar(stage.clientWidth < stage.clientHeight ? 1.15 : 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.5, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 90;
  controls.maxPolarAngle = Math.PI * 0.95;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.5;

  const hemi = new THREE.HemisphereLight(0xe4f2ff, 0x5a4630, 0.4);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d4, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 120 });
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  /* =========================================================
     Cielo (sombreador), estrellas, nubes, gaviotas
     ========================================================= */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uBot: { value: new THREE.Color() },
      uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uSunSize: { value: 800 }
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `
      uniform vec3 uTop, uHor, uBot, uSunDir, uSunCol; uniform float uSunSize; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = h > 0. ? mix(uHor, uTop, pow(smoothstep(0., 1., h), .55)) : mix(uHor, uBot, smoothstep(0., -.2, h));
        float s = max(dot(d, normalize(uSunDir)), 0.);
        col += uSunCol * (pow(s, uSunSize) * 6. + pow(s, 14.) * .35 + pow(s, 3.) * .08);
        gl_FragColor = vec4(col, 1.);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), skyMat);
  scene.add(sky);
  const skyScene = new THREE.Scene();
  skyScene.add(new THREE.Mesh(sky.geometry, skyMat));
  const pmrem = new THREE.PMREMGenerator(renderer);

  const stars = (() => {
    const n = 1600, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const u = rand() * 2 - 1, a = rand() * Math.PI * 2, y = Math.abs(u) * 0.95 + 0.05, r = Math.sqrt(1 - y * y);
      p.set([Math.cos(a) * r * 460, y * 460, Math.sin(a) * r * 460], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
    const o = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    scene.add(o);
    return o;
  })();
  const moon = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color: 0xf4f1e2, fog: false }));
  scene.add(moon);

  const clouds = new THREE.Group();
  {
    const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
    for (let k = 0; k < 16; k++) {
      const c = new THREE.Group();
      const n = 4 + (rand() * 4 | 0);
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(5 + rand() * 6, 1), cm);
        m.position.set(i * 6 - n * 3 + rand() * 3, rand() * 3, rand() * 6 - 3);
        m.scale.y = 0.6;
        c.add(m);
      }
      const a = rand() * Math.PI * 2, r = 170 + rand() * 170;
      c.position.set(Math.cos(a) * r, 45 + rand() * 40, Math.sin(a) * r);
      c.rotation.y = rand() * Math.PI;
      clouds.add(c);
    }
    scene.add(clouds);
  }

  const gulls = [];
  {
    const gm = new THREE.MeshStandardMaterial({ color: 0xf6f6f2, side: THREE.DoubleSide, roughness: 0.8 });
    const wingGeo = new THREE.BufferGeometry();
    wingGeo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0, -0.35, 0, 1.3, 0.35, 0, 0.2], 3));
    wingGeo.computeVertexNormals();
    for (let k = 0; k < 7; k++) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.5, 3, 6), gm); body.rotation.z = Math.PI / 2; g.add(body);
      const L = new THREE.Mesh(wingGeo, gm), R = new THREE.Mesh(wingGeo, gm);
      R.scale.z = -1;
      g.add(L, R);
      g.userData = { L, R, r: 14 + rand() * 14, h: 14 + rand() * 8, sp: 0.15 + rand() * 0.12, ph: rand() * Math.PI * 2, fl: 5 + rand() * 3 };
      scene.add(g);
      gulls.push(g);
    }
  }

  /* =========================================================
     Materiales y texturas
     ========================================================= */
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1000);
  const shellMats = [], xrayOnly = [];
  function shell(params) {
    const m = new THREE.MeshStandardMaterial(Object.assign({
      side: THREE.DoubleSide, clippingPlanes: [cutPlane], clipShadows: true, roughness: 0.82
    }, params));
    shellMats.push(m);
    return m;
  }
  const matCache = new Map();
  const mat = (color, extra) => {
    if (extra) return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75 }, extra));
    if (!matCache.has(color)) matCache.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.75 }));
    return matCache.get(color);
  };

  function canvasTex(c, srgb = true) {
    const t = new THREE.CanvasTexture(c);
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = maxAniso;
    return t;
  }
  function plankTex(base, line, rows, cols) {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = base; g.fillRect(0, 0, 512, 512);
    const rh = 512 / rows;
    for (let r = 0; r < rows; r++) {
      g.fillStyle = rand() < 0.5 ? `rgba(255,255,255,${rand() * 0.09})` : `rgba(0,0,0,${rand() * 0.09})`;
      g.fillRect(0, r * rh, 512, rh);
      g.strokeStyle = "rgba(0,0,0,0.06)"; g.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        const y = r * rh + rand() * rh;
        g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(170, y + rand() * 4 - 2, 340, y + rand() * 4 - 2, 512, y); g.stroke();
      }
      g.fillStyle = line;
      g.fillRect(0, r * rh, 512, 2);
      const off = (r % 3) * 512 / cols / 3;
      for (let k = 0; k < cols; k++) {
        const x = (off + k * 512 / cols) % 512;
        g.fillRect(x, r * rh, 2, rh);
        g.fillStyle = "rgba(40,25,10,.5)";
        g.fillRect(x + 5, r * rh + rh * 0.3, 2, 2); g.fillRect(x + 5, r * rh + rh * 0.7, 2, 2);
        g.fillStyle = line;
      }
    }
    const t = canvasTex(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function jollyTex(fg, bg, w, h) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    // Leve textura de lona
    g.fillStyle = "rgba(0,0,0,0.03)";
    for (let y = 0; y < h; y += Math.max(4, h / 40 | 0)) g.fillRect(0, y, w, 1);
    const cx = w / 2, cy = h * 0.56, s = Math.min(w, h) * 0.26;
    g.strokeStyle = fg; g.fillStyle = fg; g.lineCap = "round"; g.lineWidth = s * 0.22;
    for (const d of [1, -1]) {
      const ax = cx - s * 1.25, ay = cy + d * s * 1.0, bx = cx + s * 1.25, by = cy - d * s * 1.0;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      for (const [ex, ey] of [[ax, ay], [bx, by]]) {
        g.beginPath(); g.arc(ex - s * 0.08, ey - s * 0.12, s * 0.16, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(ex + s * 0.08, ey + s * 0.12, s * 0.16, 0, Math.PI * 2); g.fill();
      }
    }
    g.beginPath(); g.arc(cx, cy - s * 0.1, s * 0.74, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.roundRect ? g.roundRect(cx - s * 0.44, cy + s * 0.3, s * 0.88, s * 0.52, s * 0.12) : g.rect(cx - s * 0.44, cy + s * 0.3, s * 0.88, s * 0.52); g.fill();
    g.fillStyle = bg;
    for (const e of [-1, 1]) { g.beginPath(); g.ellipse(cx + e * s * 0.28, cy + s * 0.02, s * 0.2, s * 0.24, 0, 0, Math.PI * 2); g.fill(); }
    g.beginPath(); g.moveTo(cx, cy + s * 0.22); g.lineTo(cx - s * 0.09, cy + s * 0.38); g.lineTo(cx + s * 0.09, cy + s * 0.38); g.fill();
    g.fillRect(cx - s * 0.36, cy + s * 0.56, s * 0.72, s * 0.05);
    for (let k = -2; k <= 2; k++) g.fillRect(cx + k * s * 0.15 - s * 0.02, cy + s * 0.46, s * 0.04, s * 0.3);
    g.fillStyle = "#e9b52b";

  function mapTex() {

  const hullTex = plankTex("#e0bb82", "#7d5a2e", 16, 3);

  /* =========================================================
     Forma del casco (funciones compartidas con el sombreador del mar)

  const X0 = -9, X1 = 10.4, W = 3.5, SIDE_EXP = 0.6;

    if (x >= 0) { const t = Math.min(x / X1, 1); return W * Math.pow(Math.max(1 - Math.pow(t, 2.2), 0), 0.55); }
    const t = x / X0; return W * (1 - 0.32 * t * t * t);
  };
  const bottom = x => {
    if (x >= 0) { const t = Math.min(x / X1, 1); return -3.2 * Math.sqrt(Math.max(1 - t * t * t, 0)); }
    const t = x / X0; return -3.2 + 0.9 * t * t;
  };

    const T = top(x), B = bottom(x);

  /* =========================================================

  /* =========================================================

  P = G.hull; ROOM = "overview";
  (() => {
    const N = 90, M = 32, pos = [], uv = [], col = [], idx = [];

  /* ---------- Cubiertas y mamparos ---------- */

  ROOM = "galley";
  {

  cyl(0.18, 0.16, 0.12, mat(0x7b3f2a), -8.05, 0.96, -1.05, P, 14);                // cazo
  cyl(0.09, 0.09, 2.6, iron, -8.45, 2.1, -1.55, P, 10);                           // chimenea
  box(0.7, 0.9, 1.8, lightWood, -8.3, 0.45, 0.65);                                // encimera
  box(0.5, 0.04, 0.6, steel, -8.3, 0.91, 0.35);                                   // fregadero
  cyl(0.02, 0.02, 0.25, steel, -8.55, 1.05, 0.35, P, 6);
  box(0.35, 0.03, 0.5, mat(0xd9b27a), -8.25, 0.92, 1.1);                          // tabla de cortar
  box(0.03, 0.01, 0.22, steel, -8.2, 0.94, 1.05);                                 // cuchillo
  for (let k = 0; k < 4; k++) {                                                   // sartenes colgadas

    const pan = cyl(0.13 - k * 0.015, 0.13 - k * 0.015, 0.04, iron, x, 1.7, -0.3, P, 14); pan.rotation.x = Math.PI / 2;
  }
  box(1.6, 0.04, 0.05, darkWood, -7.7, 2.1, -0.3);
  const jarCols = [0xb23a2a, 0x3d8a4a, 0xd9a13a, 0x5b6fb0, 0x8a4ab0, 0xe0e0d0];
  for (const y of [1.3, 1.75]) {

    for (let k = 0; k < 5; k++) cyl(0.12, 0.12, 0.03, mat(0xf2f2ee), -7.5 + k * 0.45, y + 0.05, -1.9, P, 12);

      text: "La cabeza de carnero con cuernos en espiral remata la roda. Es el asiento favorito de Luffy para mirar al horizonte.",
      items: ["Cabeza y hocico tallados", "Cuernos en espiral", "Rizos de lana en la nuca", "Cuello curvado sobre la roda"], crew: "Luffy" },
    { id: "deck", name: "Cubierta principal", group: "top", grp: G.deck, anchor: V(5.2, 1.6, 0),
      cam: [V(14, 6, 10), V(3, 0.8, 0)], eye: V(7.4, 1.65, 0.6), look: V(-4, 1.6, 0),
      text: "El espacio abierto entre el mástil y la proa: aquí se pesca, se entrena y se prepara la defensa del barco.",
      items: ["Dos cañones en cureña", "Escotillón con enjaretado al dormitorio", "Barriles y cabos adujados", "Molinete del ancla", "Ancla colgada por babor", "Escaleras a la toldilla"], crew: "Zoro" },
    { id: "sail", name: "Vela mayor y jarcia", group: "top", grp: G.deck, anchor: V(2.4, 6.4, 0),
      cam: [V(19, 7, 3), V(1, 6.3, 0)],
      text: "Vela cuadra con la Jolly Roger del sombrero de paja. Luffy la dibujó primero y Usopp la repintó para que se entendiera.",
      items: ["Vela cuadra entre dos vergas", "Bandera pirata en el tope", "Obenques con flechastes para subir a la cofa", "Estay de proa y de popa", "Farol colgado del mástil"] },
    { id: "nest", name: "Cofa", group: "top", grp: G.deck, anchor: V(MAST_X, 11.6, 0),
      cam: [V(7, 14, 6), V(MAST_X, 10.5, 0)], eye: V(MAST_X - 0.35, 11.75, -0.3), look: V(14, 8.5, 0),
      text: "Puesto de vigía en lo alto del mástil. Desde aquí se avistan islas, barcos de la Marina y tormentas.",
      items: ["Plataforma circular con barandilla", "Catalejo de latón", "Acceso por los flechastes"], crew: "Usopp" },
    { id: "mikan", name: "Toldilla y mandarinos", group: "top", grp: G.roof, anchor: V(-6.6, 4.6, 0),
      cam: [V(-1, 7.5, 7.5), V(-6.6, 3.0, 0)], eye: V(-8.6, 3.95, 0.9), look: V(4, 3.4, 0),
      text: "La cubierta alta sobre la cocina. Aquí crecen los mandarinos de Bell-mère que Nami trajo de Cocoyashi, y nadie toca una mandarina sin permiso.",
      items: ["Tres mandarinos en jardineras", "Timón de ocho cabillas", "Palo de mesana con su vela", "Faroles de popa", "Tumbona de lectura"], crew: "Robin" },
    { id: "galley", name: "Cocina y comedor", group: "top", grp: G.deck, anchor: V(-6.4, 1.7, 0.3), inner: true,
      cam: [V(-6.4, 1.8, 8), V(-6.4, 1.0, 0)], eye: V(-4.95, 1.55, 1.3), look: V(-8.2, 1.0, -0.9),
      text: "El dominio de Sanji, bajo la toldilla. Toda la tripulación come alrededor de la mesa redonda.",
      items: ["Fogón de hierro con horno y chimenea", "Encimera con fregadero y tabla de cortar", "Sartenes colgadas", "Estantes de platos y especias", "Botellero", "Mesa redonda con la carne de Luffy"], crew: "Sanji" },
    { id: "women", name: "Camarote de las chicas", group: "below", grp: G.hull, anchor: V(-6.3, -0.7, 0), inner: true,
      cam: [V(-6.3, -0.6, 8), V(-6.3, -1.3, 0)], eye: V(-4.85, -0.45, -0.1), look: V(-8, -1.3, 0.2),
      text: "Bajo la cocina, en la popa. Es la habitación de Nami, y más tarde también de Robin. Aquí Nami dibuja sus cartas de navegación.",
      items: ["Dos camas", "Escritorio con cartas náuticas, pluma y tintero", "Rollos de mapas", "Caja fuerte", "Estantería de libros", "Armario y alfombra"], crew: "Nami" },
    { id: "men", name: "Dormitorio de los chicos", group: "below", grp: G.hull, anchor: V(-0.6, -0.7, 0), inner: true,
      cam: [V(-0.4, -0.5, 10), V(-0.4, -1.3, 0)], eye: V(3.2, -0.45, 0.7), look: V(-4, -1.2, 0),
      text: "Se baja por la escala del escotillón de la cubierta principal. Los chicos duermen en hamacas colgadas de los baos.",
      items: ["Cuatro hamacas", "Sofá y mesa con naipes", "Taquillas", "Banco de trabajo de Usopp", "Botiquín de Chopper", "Escala al escotillón", "Pie del mástil mayor"], crew: "Chopper" },
    { id: "hold", name: "Bodega", group: "below", grp: G.hull, anchor: V(5.8, -0.7, 0), inner: true,
      cam: [V(5.8, -0.5, 8.5), V(5.8, -1.3, 0)], eye: V(7.5, -0.45, -0.2), look: V(3.8, -1.4, 0),
      text: "El tramo de proa bajo cubierta, donde se guardan las provisiones y los repuestos con los que Usopp remienda el casco.",
      items: ["Barriles de agua y comida", "Barriles de pólvora", "Cajas y sacos", "Balas de cañón", "Tablones de repuesto", "Vela de repuesto enrollada", "Cadena del ancla"] },
    { id: "bilge", name: "Sentina y quilla", group: "below", grp: G.hull, anchor: V(0, -2.6, 0), inner: true,
      cam: [V(2, -2.2, 9), V(0, -2.6, 0)],
      text: "Bajo el sollado corren la quilla y la sobrequilla, con las cuadernas que dan forma al casco y piedras de lastre para estabilizarlo. La quilla del Merry acabó tan dañada que ya no tenía reparación.",
      items: ["Quilla y roda", "Sobrequilla", "Cuadernas cada 0,75 unidades", "Piedras de lastre", "Baos bajo la cubierta"] }
  ];
  const byId = Object.fromEntries(rooms.map(r => [r.id, r]));

  /* ---------- Etiquetas ---------- */
  const $ = id => document.getElementById(id);
  const labelsEl = $("labels");
  const tags = [];
  const listBtns = new Map();

  rooms.forEach(r => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span>${r.name}</span>` + (r.inner ? `<span class="chip">Interior</span>` : "");
    b.addEventListener("click", () => select(r.id, true));
    li.appendChild(b);
    $(r.group === "top" ? "roomsTop" : "roomsBelow").appendChild(li);
    listBtns.set(r.id, b);
    if (r.anchor) {
      const a = new THREE.Object3D(); a.position.copy(r.anchor); r.grp.add(a); r.anchorObj = a;
      const t = document.createElement("button");
      t.type = "button"; t.className = "tag"; t.textContent = r.name;
      t.addEventListener("click", () => select(r.id, true));
      labelsEl.appendChild(t);
      tags.push({ el: t, obj: a, room: r.id });
    }
  });
  crew.forEach(c => {
    const a = new THREE.Object3D();
    a.position.set(0, c.name === "Chopper" ? 1.2 : 2.05, 0);
    c.obj.add(a);
    const t = document.createElement("button");
    t.type = "button"; t.className = "tag crew"; t.textContent = c.name;
    t.addEventListener("click", () => select(c.room, true));
    labelsEl.appendChild(t);
    tags.push({ el: t, obj: a, crew: c });
  });

  /* ---------- Estado: modo, despiece, primera persona ---------- */
  let mode = "ext";
  let current = "overview";
  let inside = null;
  const cutInput = $("cut");
  const cutZ = () => 3.8 - (cutInput.value / 100) * 4.0;
  const explodeTarget = { deck: 0, roof: 0 };

  function syncWater() { water.visible = $("tSea").checked && (mode === "ext" || inside !== null); }

  function setMode(m) {
    mode = m;
    document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    $("cutRow").hidden = m !== "cut";
    cutPlane.constant = m === "cut" ? cutZ() : 1000;
    const xr = m === "xray";
    [...shellMats, ...xrayOnly].forEach(sm => { sm.transparent = xr; sm.opacity = xr ? 0.16 : 1; sm.depthWrite = !xr; sm.needsUpdate = true; });
    explodeTarget.deck = m === "explode" ? EXPLODE.deck : 0;
    explodeTarget.roof = m === "explode" ? EXPLODE.roof : 0;
    syncWater();
  }

  let flight = null;
  function flyTo(pos, target, dur = 1300) {
    if (reduceMotion) { camera.position.copy(pos); controls.target.copy(target); return; }
    flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), dur };
  }
  function stopSpin() { controls.autoRotate = false; $("tSpin").checked = false; }

  function finalAnchorWorld(r) {
    const p = r.anchor ? r.anchor.clone() : V(0, 3, 0);
    if (mode === "explode") {
      if (r.grp === G.deck) p.y += EXPLODE.deck;
      if (r.grp === G.roof) p.y += EXPLODE.deck + EXPLODE.roof;
    }
    return p;
  }

  function renderInfo(r) {
    const info = $("info");
    let html = `<h3>${r.name}</h3><p>${r.text}</p>`;
    if (r.crew) html += `<p class="who">Suele estar aquí: <b>${r.crew}</b></p>`;
    if (r.spec) html += `<dl class="spec">${r.spec.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
    if (r.items) html += `<ul class="items">${r.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    if (r.eye) html += `<button type="button" class="enter" id="enterBtn">Entrar y mirar alrededor</button>`;
    info.innerHTML = html;
    const eb = $("enterBtn");
    if (eb) eb.addEventListener("click", () => enterRoom(r.id));
  }

  function select(id, fly) {
    const r = byId[id];
    current = id;
    listBtns.forEach((b, k) => b.classList.toggle("active", k === id));
    renderInfo(r);
    if (inside && fly) exitRoom(false);
    if (!fly) return;
    stopSpin();
    if (mode === "explode") {
      const t = finalAnchorWorld(r);
      flyTo(id === "overview" ? V(24, 16, 26) : t.clone().add(V(7, 6, 10)), id === "overview" ? V(0, 5, 0) : t);
      return;
    }
    if (r.inner && mode === "ext") { cutInput.value = r.id === "bilge" ? 94 : 90; setMode("cut"); }
    else if (!r.inner && mode === "cut") setMode("ext");
    if (mode === "cut") cutPlane.constant = cutZ();
    flyTo(r.cam[0], r.cam[1]);
  }

  /* ---------- Entrar en una estancia (mirar alrededor en primera persona) ---------- */
  let saved = null;
  function enterRoom(id) {
    const r = byId[id];
    if (!r.eye) return;
    saved = { mode };
    inside = id;
    setMode("ext");
    stopSpin();
    ship.position.set(0, 0, 0); ship.rotation.set(0, 0, 0); ship.updateMatrixWorld(true);
    const dir = r.look.clone().sub(r.eye).normalize();
    const camPos = r.eye.clone().addScaledVector(dir, -0.05);
    controls.enableZoom = false; controls.enablePan = false;
    controls.rotateSpeed = -0.35;
    controls.minDistance = 0.04; controls.maxDistance = 0.06;
    controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI - 0.25;
    camera.near = 0.02; camera.fov = 70; camera.updateProjectionMatrix();
    flyTo(camPos, r.eye.clone(), 1100);
    $("insideName").textContent = r.name;
    $("insideBar").hidden = false;
    labelsEl.hidden = true;
    syncWater();
  }
  function exitRoom(restoreView = true) {
    if (!inside) return;
    const r = byId[inside];
    inside = null;
    controls.enableZoom = true; controls.enablePan = true;
    controls.rotateSpeed = 1;
    controls.minDistance = 2; controls.maxDistance = 90;
    controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI * 0.95;
    camera.near = 0.1; camera.fov = 45; camera.updateProjectionMatrix();
    $("insideBar").hidden = true;
    labelsEl.hidden = !$("tLabels").checked;
    setMode(saved ? saved.mode : "ext");
    if (restoreView) {
      if (r.inner && mode === "ext") setMode("cut");
      flyTo(r.cam[0], r.cam[1]);
    }
  }
  $("exitInside").addEventListener("click", () => exitRoom(true));
  window.addEventListener("keydown", e => { if (e.key === "Escape") exitRoom(true); });

  /* ---------- Pulsar el modelo para elegir estancia ---------- */
  const ray = new THREE.Raycaster();
  const shellSet = new Set(shellMats);
  let down = null;
  renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!down || inside) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (moved > 6 || performance.now() - down.t > 500) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({ x: (e.clientX - rect.left) / rect.width * 2 - 1, y: -(e.clientY - rect.top) / rect.height * 2 + 1 }, camera);
    const hits = ray.intersectObject(ship, true);
    for (const h of hits) {
      const o = h.object;
      if (!o.isMesh || !o.userData.room) continue;
      let vis = true; for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
      if (!vis) continue;
      if (mode === "xray" && shellSet.has(o.material)) continue;
      if (mode === "cut" && o.material.clippingPlanes && h.point.z > cutPlane.constant) continue;
      select(o.userData.room, true);
      break;
    }
  });

  /* ---------- Controles del panel ---------- */
  document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => {
    if (inside) exitRoom(false);
    setMode(b.dataset.mode);
    if (b.dataset.mode === "explode") { stopSpin(); flyTo(V(24, 16, 26), V(0, 5, 0)); }
  }));
  document.querySelectorAll("#timeSeg button").forEach(b => b.addEventListener("click", () => setTime(b.dataset.time)));
  cutInput.addEventListener("input", () => { if (mode === "cut") cutPlane.constant = cutZ(); });
  $("tSea").addEventListener("change", syncWater);
  $("tLabels").addEventListener("change", e => { labelsEl.hidden = !e.target.checked || inside !== null; });
  $("tCrew").addEventListener("change", e => { crew.forEach(c => { c.obj.visible = e.target.checked; }); });
  $("tSpin").addEventListener("change", e => { controls.autoRotate = e.target.checked && !inside; });
  $("tSpin").checked = controls.autoRotate;
  controls.addEventListener("start", () => { flight = null; if (controls.autoRotate) stopSpin(); });

  $("collapse").addEventListener("click", () => {
    const body = $("panelBody");
    body.hidden = !body.hidden;
    $("collapse").textContent = body.hidden ? "+" : "–";
    $("collapse").setAttribute("aria-expanded", String(!body.hidden));
    $("collapse").setAttribute("aria-label", body.hidden ? "Desplegar panel" : "Plegar panel");
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  setTime("day");
  setMode("ext");
  select("overview", false);

  /* =========================================================
     Bucle
     ========================================================= */
  const tmp = new THREE.Vector3();
  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = clock.elapsedTime;
    const ease = 1 - Math.pow(0.001, dt);   // aproximación suave independiente de los FPS

    if (flight) {
      const k = Math.min(1, (performance.now() - flight.start) / flight.dur);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.t0, flight.t1, e);
      if (k >= 1) flight = null;
    }
    controls.update();

    // Despiece
    G.deck.position.y += (explodeTarget.deck - G.deck.position.y) * ease;
    G.roof.position.y += (explodeTarget.roof - G.roof.position.y) * ease;

    // Balanceo solo con el barco a flote y visto desde fuera
    const bob = mode === "ext" && !inside && !reduceMotion;
    ship.rotation.z += ((bob ? Math.sin(t * 0.6) * 0.018 : 0) - ship.rotation.z) * 0.1;
    ship.rotation.x += ((bob ? Math.sin(t * 0.8) * 0.025 : 0) - ship.rotation.x) * 0.1;
    ship.position.y += ((bob ? Math.sin(t * 0.9) * 0.08 : 0) - ship.position.y) * 0.1;
    ship.updateMatrixWorld();

    waterMat.uniforms.uTime.value = reduceMotion ? 0 : t;
    waterMat.uniforms.uShipInv.value.copy(ship.matrixWorld).invert();

    {
      const p = flag.geometry.attributes.position, base = flag.userData.base;
      for (let i = 0; i < p.count; i++) p.array[i * 3 + 2] = Math.sin(base[i * 3] * 3.2 - t * 5) * 0.14 * base[i * 3];
      p.needsUpdate = true;
    }

    sky.position.copy(camera.position);
    stars.position.copy(camera.position);
    if (moon.visible) moon.position.copy(camera.position).addScaledVector(moon.userData.dir, 420);
    clouds.rotation.y = t * 0.004;
    gulls.forEach(g => {
      if (!g.visible) return;
      const d = g.userData, a = d.ph + t * d.sp;
      g.position.set(Math.cos(a) * d.r + 1, d.h + Math.sin(t * 0.7 + d.ph) * 1.2, Math.sin(a) * d.r);
      g.rotation.y = -a;
      const f = Math.sin(t * d.fl + d.ph) * 0.6;
      d.L.rotation.x = f; d.R.rotation.x = -f;
    });

    renderer.render(scene, camera);

    if (!labelsEl.hidden) {
      const w = stage.clientWidth, h = stage.clientHeight;
      const crewOn = $("tCrew").checked;
      tags.forEach(tg => {
        let show = true;
        if (tg.crew) show = crewOn && tg.crew.room === current;
        if (show) {
          tg.obj.getWorldPosition(tmp);
          tmp.project(camera);
          show = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
        }
        tg.el.style.display = show ? "" : "none";
        if (tg.room) tg.el.classList.toggle("active", tg.room === current);
        if (show) tg.el.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`;
      });
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
